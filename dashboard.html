<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MloHub | Restaurant Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        linear-gradient(135deg, #ff9800, #ffb300);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 38px;
      font-weight: 900;
      color: #f57c00;
    }

    .logo p {
      margin-top: 5px;
      color: #777;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #f57c00;
      box-shadow: 0 0 0 3px rgba(245,124,0,.1);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #f57c00;
      color: #fff;
      font-weight: 800;
    }

    .primary-btn:hover {
      background: #e96f00;
    }

    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error-message {
      margin-bottom: 15px;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #ffcdd2;
      background: #fff0f0;
      color: #c62828;
      font-size: 14px;
    }

    .success-message {
      margin-bottom: 15px;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #c8e6c9;
      background: #effaf1;
      color: #2e7d32;
      font-size: 14px;
    }

    /* =========================
       DASHBOARD
    ========================= */

    #dashboardScreen {
      min-height: 100vh;
    }

    .topbar {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 25px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #111;
      color: #fff;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-brand strong {
      color: #ff9800;
      font-size: 25px;
    }

    .restaurant-name {
      padding-left: 12px;
      border-left: 1px solid #555;
      color: #ddd;
      font-size: 14px;
    }

    .logout-btn {
      padding: 9px 15px;
      border: 1px solid #555;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: #222;
    }

    .container {
      width: min(1250px, 94%);
      margin: 25px auto 50px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h2 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .page-title p {
      color: #777;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      padding: 20px;
      border-left: 4px solid #f57c00;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .stat-card .number {
      margin-bottom: 5px;
      font-size: 28px;
      font-weight: 900;
    }

    .stat-card .label {
      color: #777;
      font-size: 14px;
    }

    /* =========================
       TABS
    ========================= */

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 7px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .tab-btn {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #666;
      font-weight: 800;
    }

    .tab-btn.active {
      background: #f57c00;
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section-card {
      margin-bottom: 20px;
      padding: 20px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-header h3 {
      font-size: 20px;
    }

    .orange-btn {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #f57c00;
      color: #fff;
      font-weight: 800;
    }

    .orange-btn:hover {
      background: #e96f00;
    }

    .orange-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary-btn {
      padding: 9px 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font-weight: 700;
    }

    .secondary-btn:hover {
      background: #f7f7f7;
    }

    .danger-btn {
      padding: 9px 13px;
      border: none;
      border-radius: 8px;
      background: #d32f2f;
      color: #fff;
      font-weight: 700;
    }

    .danger-btn:hover {
      background: #b71c1c;
    }

    /* =========================
       ORDERS
    ========================= */

    .order-list {
      display: grid;
      gap: 15px;
    }

    .order-card {
      padding: 17px;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      background: #fff;
    }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .order-id {
      font-size: 18px;
      font-weight: 900;
    }

    .order-date {
      margin-top: 3px;
      color: #777;
      font-size: 13px;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .info-box {
      padding: 10px;
      border-radius: 8px;
      background: #f8f8f8;
    }

    .info-box small {
      display: block;
      margin-bottom: 3px;
      color: #888;
    }

    .info-box strong {
      font-size: 14px;
      word-break: break-word;
    }

    .order-items {
      padding: 12px 0;
      margin-bottom: 12px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 5px 0;
      font-size: 14px;
    }

    .order-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-total {
      font-size: 18px;
      font-weight: 900;
    }

    .status-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-select {
      min-width: 170px;
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      text-transform: capitalize;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-confirmed {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-preparing {
      background: #ede9fe;
      color: #6d28d9;
    }

    .status-ready {
      background: #dcfce7;
      color: #166534;
    }

    .status-out_for_delivery {
      background: #cffafe;
      color: #155e75;
    }

    .status-delivered,
    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    /* =========================
       MENU
    ========================= */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .menu-card {
      overflow: hidden;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      background: #fff;
    }

    .menu-card-body {
      padding: 15px;
    }

    .menu-card h4 {
      margin-bottom: 5px;
      font-size: 17px;
    }

    .menu-category {
      margin-bottom: 10px;
      color: #888;
      font-size: 13px;
    }

    .menu-price {
      margin-bottom: 10px;
      color: #f57c00;
      font-size: 20px;
      font-weight: 900;
    }

    .available {
      margin-bottom: 10px;
      color: #2e7d32;
      font-size: 13px;
      font-weight: 700;
    }

    .unavailable {
      margin-bottom: 10px;
      color: #c62828;
      font-size: 13px;
      font-weight: 700;
    }

    .menu-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      background: rgba(0,0,0,.6);
    }

    .modal-card {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 15px;
      background: #fff;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 21px;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: #f3f3f3;
      font-size: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #777;
    }

    .empty-icon {
      margin-bottom: 10px;
      font-size: 45px;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 12px 15px;
      }

      .restaurant-name {
        display: none;
      }

      .container {
        width: 94%;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab-btn {
        white-space: nowrap;
      }

      .status-area {
        width: 100%;
      }

      .status-select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN SCREEN
  ====================================================== -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">
        <h1>MloHub</h1>
        <p>Restaurant Partner Dashboard</p>
      </div>

      <div
        id="loginError"
        class="error-message hidden"
      ></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="primary-btn"
          id="loginBtn"
        >
          Login
        </button>

      </form>

    </div>

  </section>


  <!-- =====================================================
       DASHBOARD
  ====================================================== -->

  <section
    id="dashboardScreen"
    class="hidden"
  >

    <header class="topbar">

      <div class="topbar-brand">

        <strong>MloHub</strong>

        <span
          class="restaurant-name"
          id="restaurantNameTop"
        >
          Restaurant
        </span>

      </div>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

    </header>


    <main class="container">

      <div class="page-title">

        <h2 id="welcomeTitle">
          Restaurant Dashboard
        </h2>

        <p>
          Manage your orders and menu from one place.
        </p>

      </div>


      <!-- STATS -->

      <div class="stats-grid">

        <div class="stat-card">
          <div
            class="number"
            id="totalOrders"
          >
            0
          </div>

          <div class="label">
            Total Orders
          </div>
        </div>

        <div class="stat-card">
          <div
            class="number"
            id="pendingOrders"
          >
            0
          </div>

          <div class="label">
            Pending Orders
          </div>
        </div>

        <div class="stat-card">
          <div
            class="number"
            id="todayOrders"
          >
            0
          </div>

          <div class="label">
            Today's Orders
          </div>
        </div>

        <div class="stat-card">
          <div
            class="number"
            id="menuCount"
          >
            0
          </div>

          <div class="label">
            Menu Items
          </div>
        </div>

      </div>


      <!-- TABS -->

      <div class="tabs">

        <button
          class="tab-btn active"
          data-tab="ordersTab"
        >
          📦 Orders
        </button>

        <button
          class="tab-btn"
          data-tab="menuTab"
        >
          🍔 Menu Management
        </button>

      </div>


      <!-- ORDERS -->

      <section
        id="ordersTab"
        class="tab-content active"
      >

        <div class="section-card">

          <div class="section-header">

            <h3>
              Recent Orders
            </h3>

            <button
              class="secondary-btn"
              id="refreshOrdersBtn"
            >
              🔄 Refresh
            </button>

          </div>

          <div id="ordersMessage"></div>

          <div
            id="ordersList"
            class="order-list"
          >
            <div class="loading">
              Loading orders...
            </div>
          </div>

        </div>

      </section>


      <!-- MENU -->

      <section
        id="menuTab"
        class="tab-content"
      >

        <div class="section-card">

          <div class="section-header">

            <h3>
              Your Menu
            </h3>

            <button
              class="orange-btn"
              id="addMenuBtn"
            >
              + Add Menu Item
            </button>

          </div>

          <div id="menuMessage"></div>

          <div
            id="menuList"
            class="menu-grid"
          >
            <div class="loading">
              Loading menu...
            </div>
          </div>

        </div>

      </section>

    </main>

  </section>


  <!-- =====================================================
       MENU MODAL
  ====================================================== -->

  <div
    id="menuModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h3 id="menuModalTitle">
          Add Menu Item
        </h3>

        <button
          class="close-btn"
          id="closeMenuModal"
          type="button"
        >
          ×
        </button>

      </div>


      <div
        id="menuFormError"
        class="error-message hidden"
      ></div>


      <form id="menuForm">

        <input
          type="hidden"
          id="menuItemId"
        >


        <div class="form-group">

          <label for="menuName">
            Item Name
          </label>

          <input
            type="text"
            id="menuName"
            placeholder="e.g. Chicken Zinger Burger"
            required
          >

        </div>


        <div class="form-group">

          <label for="menuPrice">
            Price (KSh)
          </label>

          <input
            type="number"
            id="menuPrice"
            placeholder="500"
            min="0"
            step="1"
            required
          >

        </div>


        <div class="form-group">

          <label for="menuCategory">
            Category
          </label>

          <input
            type="text"
            id="menuCategory"
            placeholder="e.g. Burgers"
          >

        </div>


        <div class="form-group">

          <label for="menuAvailable">
            Availability
          </label>

          <select id="menuAvailable">

            <option value="true">
              Available
            </option>

            <option value="false">
              Not Available
            </option>

          </select>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="secondary-btn"
            id="cancelMenuBtn"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="orange-btn"
            id="saveMenuBtn"
          >
            Add Item
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
    ====================================================== */

    const SUPABASE_URL =
      "https://bhvzpycbztngtwuhxxex.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";


    /*
      IMPORTANT:
      We deliberately use supabaseClient instead of supabase
      so the global Supabase library and our client cannot
      conflict with each other.
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       STATE
    ====================================================== */

    let currentUser = null;
    let currentRestaurant = null;
    let currentOrders = [];
    let currentMenu = [];
    let ordersTimer = null;


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const dashboardScreen =
      document.getElementById("dashboardScreen");

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginError =
      document.getElementById("loginError");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const restaurantNameTop =
      document.getElementById("restaurantNameTop");

    const welcomeTitle =
      document.getElementById("welcomeTitle");

    const ordersList =
      document.getElementById("ordersList");

    const menuList =
      document.getElementById("menuList");

    const ordersMessage =
      document.getElementById("ordersMessage");

    const menuMessage =
      document.getElementById("menuMessage");

    const refreshOrdersBtn =
      document.getElementById("refreshOrdersBtn");

    const addMenuBtn =
      document.getElementById("addMenuBtn");

    const menuModal =
      document.getElementById("menuModal");

    const closeMenuModal =
      document.getElementById("closeMenuModal");

    const cancelMenuBtn =
      document.getElementById("cancelMenuBtn");

    const menuForm =
      document.getElementById("menuForm");

    const menuModalTitle =
      document.getElementById("menuModalTitle");

    const menuItemId =
      document.getElementById("menuItemId");

    const menuName =
      document.getElementById("menuName");

    const menuPrice =
      document.getElementById("menuPrice");

    const menuCategory =
      document.getElementById("menuCategory");

    const menuAvailable =
      document.getElementById("menuAvailable");

    const menuFormError =
      document.getElementById("menuFormError");

    const saveMenuBtn =
      document.getElementById("saveMenuBtn");


    /* =====================================================
       HELPERS
    ====================================================== */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatMoney(value) {

      return "KSh " +
        Number(value || 0).toLocaleString("en-KE");

    }


    function formatDate(value) {

      if (!value) {
        return "";
      }

      const date =
        new Date(value);

      return date.toLocaleString(
        "en-KE",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    }


    function formatStatus(status) {

      if (!status) {
        return "Unknown";
      }

      return String(status)
        .replace(/_/g, " ")
        .replace(/\b\w/g, char =>
          char.toUpperCase()
        );

    }


    function statusClass(status) {

      return "status-" +
        String(status || "")
          .toLowerCase()
          .replace(/\s+/g, "_");

    }


    function isToday(value) {

      if (!value) {
        return false;
      }

      const date =
        new Date(value);

      const now =
        new Date();

      return (
        date.getFullYear() ===
          now.getFullYear() &&
        date.getMonth() ===
          now.getMonth() &&
        date.getDate() ===
          now.getDate()
      );

    }


    function showLoginError(message) {

      loginError.textContent =
        message;

      loginError.classList.remove(
        "hidden"
      );

    }


    function clearLoginError() {

      loginError.textContent = "";

      loginError.classList.add(
        "hidden"
      );

    }


    function showOrdersMessage(
      message,
      type = "success"
    ) {

      ordersMessage.innerHTML = `
        <div class="${
          type === "error"
            ? "error-message"
            : "success-message"
        }">
          ${escapeHtml(message)}
        </div>
      `;

      setTimeout(() => {
        ordersMessage.innerHTML = "";
      }, 3500);

    }


    function showMenuMessage(
      message,
      type = "success"
    ) {

      menuMessage.innerHTML = `
        <div class="${
          type === "error"
            ? "error-message"
            : "success-message"
        }">
          ${escapeHtml(message)}
        </div>
      `;

      setTimeout(() => {
        menuMessage.innerHTML = "";
      }, 3500);

    }


    /* =====================================================
       LOGIN
    ====================================================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearLoginError();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        if (!email || !password) {

          showLoginError(
            "Please enter your email and password."
          );

          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent =
          "Logging in...";

        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email,
                password
              });

          if (error) {
            throw error;
          }

          if (!data || !data.user) {
            throw new Error(
              "Login succeeded but no user was returned."
            );
          }

          currentUser =
            data.user;

          await startDashboard();

        } catch (error) {

          console.error(
            "Login error:",
            error
          );

          showLoginError(
            error.message ||
            "Login failed. Please check your email and password."
          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

        }

      }
    );


    /* =====================================================
       START DASHBOARD
    ====================================================== */

    async function startDashboard() {

      try {

        await loadRestaurant();

        loginScreen.classList.add(
          "hidden"
        );

        dashboardScreen.classList.remove(
          "hidden"
        );

        restaurantNameTop.textContent =
          currentRestaurant.name;

        welcomeTitle.textContent =
          currentRestaurant.name +
          " Dashboard";

        await Promise.all([
          loadOrders(),
          loadMenu()
        ]);

        startAutoRefresh();

      } catch (error) {

        console.error(
          "Dashboard startup error:",
          error
        );

        await supabaseClient.auth.signOut();

        dashboardScreen.classList.add(
          "hidden"
        );

        loginScreen.classList.remove(
          "hidden"
        );

        showLoginError(
          error.message ||
          "Unable to load your restaurant."
        );

      }

    }


    /* =====================================================
       LOAD RESTAURANT
    ====================================================== */

    async function loadRestaurant() {

      if (!currentUser) {

        const {
          data: {
            user
          }
        } =
          await supabaseClient.auth
            .getUser();

        currentUser =
          user;

      }

      if (!currentUser) {

        throw new Error(
          "You are not logged in."
        );

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from("restaurants")
          .select("*")
          .eq(
            "owner_id",
            currentUser.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Restaurant query error:",
          error
        );

        throw new Error(
          "Unable to load your restaurant: " +
          error.message
        );

      }


      if (!data) {

        throw new Error(
          "No restaurant is linked to this account. Please contact MloHub."
        );

      }


      currentRestaurant =
        data;

    }


    /* =====================================================
       LOAD ORDERS
    ====================================================== */

    async function loadOrders() {

      if (!currentRestaurant) {
        return;
      }

      ordersList.innerHTML = `
        <div class="loading">
          Loading orders...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("orders")
            .select(`
              *,
              order_items (
                id,
                quantity,
                price,
                menu_items (
                  id,
                  name
                )
              )
            `)
            .eq(
              "restaurant_id",
              currentRestaurant.id
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        currentOrders =
          data || [];

        updateOrderStats();

        renderOrders();


      } catch (error) {

        console.error(
          "Orders error:",
          error
        );

        ordersList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Unable to load orders
            </h3>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

      }

    }


    /* =====================================================
       ORDER STATS
    ====================================================== */

    function updateOrderStats() {

      const total =
        currentOrders.length;

      const pending =
        currentOrders.filter(
          order =>
            order.status === "pending"
        ).length;

      const today =
        currentOrders.filter(
          order =>
            isToday(order.created_at)
        ).length;


      document.getElementById(
        "totalOrders"
      ).textContent =
        total;


      document.getElementById(
        "pendingOrders"
      ).textContent =
        pending;


      document.getElementById(
        "todayOrders"
      ).textContent =
        today;

    }


    /* =====================================================
       RENDER ORDERS
    ====================================================== */

    function renderOrders() {

      if (!currentOrders.length) {

        ordersList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              📦
            </div>

            <h3>
              No orders yet
            </h3>

            <p>
              New customer orders will appear here.
            </p>

          </div>
        `;

        return;
      }


      ordersList.innerHTML =
        currentOrders
          .map(order => {

            const items =
              order.order_items || [];


            const itemsHtml =
              items.length

                ? items
                    .map(item => `

                      <div class="order-item">

                        <span>
                          ${Number(
                            item.quantity || 0
                          )} ×
                          ${escapeHtml(
                            item.menu_items?.name ||
                            "Menu item"
                          )}
                        </span>

                        <strong>
                          ${formatMoney(
                            Number(item.price || 0) *
                            Number(item.quantity || 0)
                          )}
                        </strong>

                      </div>

                    `)
                    .join("")

                : `
                    <div class="order-item">
                      <span>
                        No item details
                      </span>
                    </div>
                  `;


            return `

              <div class="order-card">

                <div class="order-top">

                  <div>

                    <div class="order-id">
                      Order #${escapeHtml(order.id)}
                    </div>

                    <div class="order-date">
                      ${formatDate(
                        order.created_at
                      )}
                    </div>

                  </div>


                  <span
                    class="status-badge ${statusClass(
                      order.status
                    )}"
                  >
                    ${formatStatus(
                      order.status
                    )}
                  </span>

                </div>


                <div class="order-info">

                  <div class="info-box">

                    <small>
                      Customer
                    </small>

                    <strong>
                      ${escapeHtml(
                        order.customer_name ||
                        "Customer"
                      )}
                    </strong>

                  </div>


                  <div class="info-box">

                    <small>
                      Phone
                    </small>

                    <strong>
                      ${escapeHtml(
                        order.customer_phone ||
                        order.phone ||
                        "Not provided"
                      )}
                    </strong>

                  </div>


                  <div class="info-box">

                    <small>
                      Delivery Address
                    </small>

                    <strong>
                      ${escapeHtml(
                        order.delivery_address ||
                        order.address ||
                        "Not provided"
                      )}
                    </strong>

                  </div>


                  <div class="info-box">

                    <small>
                      Payment
                    </small>

                    <strong>
                      ${escapeHtml(
                        order.payment_method ||
                        "Not specified"
                      )}
                    </strong>

                  </div>

                </div>


                <div class="order-items">

                  ${itemsHtml}

                </div>


                <div class="order-bottom">

                  <div class="order-total">

                    Total:
                    ${formatMoney(
                      order.total
                    )}

                  </div>


                  <div class="status-area">

                    <select
                      class="status-select"
                      data-order-id="${escapeHtml(
                        order.id
                      )}"
                    >

                      ${getStatusOptions(
                        order.status
                      )}

                    </select>

                  </div>

                </div>

              </div>

            `;

          })
          .join("");


      document
        .querySelectorAll(
          ".status-select"
        )
        .forEach(select => {

          select.addEventListener(
            "change",
            async function() {

              const orderId =
                this.dataset.orderId;

              const newStatus =
                this.value;

              await updateOrderStatus(
                orderId,
                newStatus
              );

            }
          );

        });

    }


    /* =====================================================
       STATUS OPTIONS
    ====================================================== */

    function getStatusOptions(
      currentStatus
    ) {

      const statuses = [
        "pending",
        "confirmed",
        "preparing",
        "ready",
        "out_for_delivery",
        "delivered",
        "cancelled"
      ];


      return statuses
        .map(status => `

          <option
            value="${status}"
            ${
              status === currentStatus
                ? "selected"
                : ""
            }
          >
            ${formatStatus(status)}
          </option>

        `)
        .join("");

    }


    /* =====================================================
       UPDATE ORDER STATUS
    ====================================================== */

    async function updateOrderStatus(
      orderId,
      newStatus
    ) {

      try {

        const {
          error
        } =
          await supabaseClient
            .from("orders")
            .update({
              status: newStatus
            })
            .eq(
              "id",
              orderId
            )
            .eq(
              "restaurant_id",
              currentRestaurant.id
            );


        if (error) {
          throw error;
        }


        showOrdersMessage(
          `Order #${orderId} updated to ${formatStatus(
            newStatus
          )}.`
        );


        await loadOrders();


      } catch (error) {

        console.error(
          "Update status error:",
          error
        );


        showOrdersMessage(
          error.message ||
          "Unable to update order.",
          "error"
        );


        await loadOrders();

      }

    }


    /* =====================================================
       LOAD MENU
    ====================================================== */

    async function loadMenu() {

      if (!currentRestaurant) {
        return;
      }


      menuList.innerHTML = `
        <div class="loading">
          Loading menu...
        </div>
      `;


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("menu_items")
            .select(`
              id,
              name,
              price,
              available,
              category,
              restaurant_id
            `)
            .eq(
              "restaurant_id",
              currentRestaurant.id
            )
            .order(
              "id",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        currentMenu =
          data || [];


        document.getElementById(
          "menuCount"
        ).textContent =
          currentMenu.length;


        renderMenu();


      } catch (error) {

        console.error(
          "Menu error:",
          error
        );


        menuList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Unable to load menu
            </h3>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

      }

    }


    /* =====================================================
       RENDER MENU
    ====================================================== */

    function renderMenu() {

      if (!currentMenu.length) {

        menuList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              🍔
            </div>

            <h3>
              No menu items
            </h3>

            <p>
              Add your first menu item.
            </p>

          </div>
        `;

        return;
      }


      menuList.innerHTML =
        currentMenu
          .map(item => `

            <div class="menu-card">

              <div class="menu-card-body">

                <h4>
                  ${escapeHtml(
                    item.name
                  )}
                </h4>

                <div class="menu-category">
                  ${escapeHtml(
                    item.category ||
                    "General"
                  )}
                </div>

                <div class="menu-price">
                  ${formatMoney(
                    item.price
                  )}
                </div>

                <div
                  class="${
                    item.available
                      ? "available"
                      : "unavailable"
                  }"
                >
                  ${
                    item.available
                      ? "● Available"
                      : "● Not Available"
                  }
                </div>

                <div class="menu-actions">

                  <button
                    class="secondary-btn edit-menu-btn"
                    data-id="${escapeHtml(
                      item.id
                    )}"
                    type="button"
                  >
                    Edit
                  </button>

                  <button
                    class="secondary-btn toggle-menu-btn"
                    data-id="${escapeHtml(
                      item.id
                    )}"
                    type="button"
                  >
                    ${
                      item.available
                        ? "Disable"
                        : "Enable"
                    }
                  </button>

                  <button
                    class="danger-btn delete-menu-btn"
                    data-id="${escapeHtml(
                      item.id
                    )}"
                    type="button"
                  >
                    Delete
                  </button>

                </div>

              </div>

            </div>

          `)
          .join("");


      document
        .querySelectorAll(
          ".edit-menu-btn"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const item =
                currentMenu.find(
                  menuItem =>
                    String(
                      menuItem.id
                    ) ===
                    String(
                      button.dataset.id
                    )
                );


              if (item) {
                openEditMenu(item);
              }

            }
          );

        });


      document
        .querySelectorAll(
          ".toggle-menu-btn"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              toggleMenuAvailability(
                button.dataset.id
              );

            }
          );

        });


      document
        .querySelectorAll(
          ".delete-menu-btn"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              deleteMenuItem(
                button.dataset.id
              );

            }
          );

        });

    }


    /* =====================================================
       ADD MENU
    ====================================================== */

    addMenuBtn.addEventListener(
      "click",
      () => {

        menuForm.reset();

        menuItemId.value = "";

        menuAvailable.value =
          "true";

        menuModalTitle.textContent =
          "Add Menu Item";

        saveMenuBtn.textContent =
          "Add Item";

        menuFormError.classList.add(
          "hidden"
        );

        menuModal.classList.remove(
          "hidden"
        );

      }
    );


    /* =====================================================
       EDIT MENU
    ====================================================== */

    function openEditMenu(item) {

      menuItemId.value =
        item.id;

      menuName.value =
        item.name || "";

      menuPrice.value =
        item.price || "";

      menuCategory.value =
        item.category || "";

      menuAvailable.value =
        item.available
          ? "true"
          : "false";

      menuModalTitle.textContent =
        "Edit Menu Item";

      saveMenuBtn.textContent =
        "Save Changes";

      menuFormError.classList.add(
        "hidden"
      );

      menuModal.classList.remove(
        "hidden"
      );

    }


    /* =====================================================
       CLOSE MENU MODAL
    ====================================================== */

    function closeMenuModalWindow() {

      menuModal.classList.add(
        "hidden"
      );

    }


    closeMenuModal.addEventListener(
      "click",
      closeMenuModalWindow
    );


    cancelMenuBtn.addEventListener(
      "click",
      closeMenuModalWindow
    );


    menuModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          menuModal
        ) {

          closeMenuModalWindow();

        }

      }
    );


    /* =====================================================
       SAVE MENU
    ====================================================== */

    menuForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        menuFormError.classList.add(
          "hidden"
        );


        const id =
          menuItemId.value.trim();

        const name =
          menuName.value.trim();

        const price =
          Number(
            menuPrice.value
          );

        const category =
          menuCategory.value.trim();

        const available =
          menuAvailable.value ===
          "true";


        if (!name) {

          menuFormError.textContent =
            "Please enter the menu item name.";

          menuFormError.classList.remove(
            "hidden"
          );

          return;

        }


        if (
          !Number.isFinite(price) ||
          price < 0
        ) {

          menuFormError.textContent =
            "Please enter a valid price.";

          menuFormError.classList.remove(
            "hidden"
          );

          return;

        }


        saveMenuBtn.disabled = true;

        saveMenuBtn.textContent =
          "Saving...";


        try {

          if (id) {

            const {
              error
            } =
              await supabaseClient
                .from("menu_items")
                .update({
                  name,
                  price,
                  category,
                  available
                })
                .eq(
                  "id",
                  id
                )
                .eq(
                  "restaurant_id",
                  currentRestaurant.id
                );


            if (error) {
              throw error;
            }


            showMenuMessage(
              "Menu item updated successfully."
            );


          } else {

            const {
              error
            } =
              await supabaseClient
                .from("menu_items")
                .insert({
                  name,
                  price,
                  category,
                  available,
                  restaurant_id:
                    currentRestaurant.id
                });


            if (error) {
              throw error;
            }


            showMenuMessage(
              "Menu item added successfully."
            );

          }


          closeMenuModalWindow();

          await loadMenu();


        } catch (error) {

          console.error(
            "Save menu error:",
            error
          );


          menuFormError.textContent =
            error.message ||
            "Unable to save menu item.";


          menuFormError.classList.remove(
            "hidden"
          );


        } finally {

          saveMenuBtn.disabled = false;

          saveMenuBtn.textContent =
            id
              ? "Save Changes"
              : "Add Item";

        }

      }
    );


    /* =====================================================
       TOGGLE AVAILABILITY
    ====================================================== */

    async function toggleMenuAvailability(
      id
    ) {

      const item =
        currentMenu.find(
          menuItem =>
            String(menuItem.id) ===
            String(id)
        );


      if (!item) {
        return;
      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("menu_items")
            .update({
              available:
                !item.available
            })
            .eq(
              "id",
              id
            )
            .eq(
              "restaurant_id",
              currentRestaurant.id
            );


        if (error) {
          throw error;
        }


        showMenuMessage(
          item.available
            ? `${item.name} is now unavailable.`
            : `${item.name} is now available.`
        );


        await loadMenu();


      } catch (error) {

        console.error(
          "Toggle menu error:",
          error
        );


        showMenuMessage(
          error.message ||
          "Unable to change availability.",
          "error"
        );

      }

    }


    /* =====================================================
       DELETE MENU
    ====================================================== */

    async function deleteMenuItem(
      id
    ) {

      const item =
        currentMenu.find(
          menuItem =>
            String(menuItem.id) ===
            String(id)
        );


      if (!item) {
        return;
      }


      const confirmed =
        confirm(
          `Delete "${item.name}" from your menu?`
        );


      if (!confirmed) {
        return;
      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("menu_items")
            .delete()
            .eq(
              "id",
              id
            )
            .eq(
              "restaurant_id",
              currentRestaurant.id
            );


        if (error) {
          throw error;
        }


        showMenuMessage(
          `${item.name} was deleted.`
        );


        await loadMenu();


      } catch (error) {

        console.error(
          "Delete menu error:",
          error
        );


        showMenuMessage(
          error.message ||
          "Unable to delete menu item.",
          "error"
        );

      }

    }


    /* =====================================================
       TABS
    ====================================================== */

    document
      .querySelectorAll(
        ".tab-btn"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".tab-btn"
              )
              .forEach(btn =>
                btn.classList.remove(
                  "active"
                )
              );


            document
              .querySelectorAll(
                ".tab-content"
              )
              .forEach(tab =>
                tab.classList.remove(
                  "active"
                )
              );


            button.classList.add(
              "active"
            );


            const target =
              document.getElementById(
                button.dataset.tab
              );


            if (target) {

              target.classList.add(
                "active"
              );

            }

          }
        );

      });


    /* =====================================================
       REFRESH ORDERS
    ====================================================== */

    refreshOrdersBtn.addEventListener(
      "click",
      async () => {

        refreshOrdersBtn.disabled =
          true;

        refreshOrdersBtn.textContent =
          "Refreshing...";


        await loadOrders();


        refreshOrdersBtn.disabled =
          false;

        refreshOrdersBtn.textContent =
          "🔄 Refresh";

      }
    );


    /* =====================================================
       AUTO REFRESH
    ====================================================== */

    function startAutoRefresh() {

      stopAutoRefresh();


      ordersTimer =
        setInterval(
          async () => {

            if (
              currentUser &&
              currentRestaurant
            ) {

              await loadOrders();

            }

          },
          15000
        );

    }


    function stopAutoRefresh() {

      if (ordersTimer) {

        clearInterval(
          ordersTimer
        );

        ordersTimer = null;

      }

    }


    /* =====================================================
       LOGOUT
    ====================================================== */

    logoutBtn.addEventListener(
      "click",
      async () => {

        stopAutoRefresh();


        await supabaseClient.auth
          .signOut();


        currentUser = null;
        currentRestaurant = null;
        currentOrders = [];
        currentMenu = [];


        dashboardScreen.classList.add(
          "hidden"
        );

        loginScreen.classList.remove(
          "hidden"
        );


        loginForm.reset();

        clearLoginError();

      }
    );


    /* =====================================================
       CHECK EXISTING SESSION
    ====================================================== */

    async function checkExistingSession() {

      try {

        const {
          data: {
            session
          }
        } =
          await supabaseClient.auth
            .getSession();


        if (
          session &&
          session.user
        ) {

          currentUser =
            session.user;

          await startDashboard();

        }

      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    /* =====================================================
       AUTH STATE
    ====================================================== */

    supabaseClient.auth
      .onAuthStateChange(
        (event, session) => {

          if (
            event ===
            "SIGNED_OUT"
          ) {

            stopAutoRefresh();

            currentUser = null;
            currentRestaurant = null;

            dashboardScreen.classList.add(
              "hidden"
            );

            loginScreen.classList.remove(
              "hidden"
            );

          }

        }
      );


    /* =====================================================
       START APPLICATION
    ====================================================== */

    checkExistingSession();

  </script>

</body>
</html>
