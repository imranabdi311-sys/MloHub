</head>

<body>

  <div class="header-inner">
    <div>
      <div class="logo">🍽️ MloHub</div>
      <div class="restaurant-name" id="restaurantTitle">
        Restaurant Dashboard
      </div>
    </div>

    <button class="secondary" onclick="refreshAll()">
      🔄 Refresh
    </button>
  </div>
</header>

<div class="container">

  <div id="message"></div>

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-icon">📦</div>
      <h3 id="totalOrders">0</h3>
      <p>Total Orders</p>

    <div class="stat">
      <div class="stat-icon">⏳</div>

    <div class="stat">
      <div class="stat-icon">🍔</div>

    <div class="stat">

  <!-- TABS -->

  <div class="tabs">

    >

  <section id="ordersPanel" class="panel active">

    <div class="card">

  <section id="menuPanel" class="panel">

    <div class="card">

      <h2>🍔 Manage Menu</h2>

      <input
        id="menuAdminSearch"
        placeholder="🔎 Search menu..."
        oninput="filterAdminMenu()"
      >

      <div id="adminMenuList" class="menu-list">
        Loading menu...

  <section id="addPanel" class="panel">

      </button>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   SETTINGS
========================================= */

/*
  Albaik restaurant ID
*/

const RESTAURANT_ID = 2;

let restaurant = null;

let menuItems = [];

let orders = [];


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="info"){

  const box =
    document.getElementById(
      "message"
    );

  box.className =
    "message " + type;

  box.textContent =
    text;

  setTimeout(function(){

    box.className = "";

    box.textContent = "";

  },4000);

}


/* =========================================
   LOAD RESTAURANT
========================================= */

async function loadRestaurant(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("restaurants")
      .select("*")
      .eq(
        "id",
        RESTAURANT_ID
      )
      .single();

  if(error){

    console.error(error);

    showMessage(
      "Could not load restaurant: " +
      error.message,
      "error"
    );

    return;

  }

  restaurant =
    data;

  document
    .getElementById(
      "restaurantTitle"
    )
    .textContent =
    restaurant.name +
    " Dashboard";

}


/* =========================================
   LOAD MENU
========================================= */

async function loadMenu(){

  const box =
    document.getElementById(
      "adminMenuList"
    );

  box.innerHTML =
    "Loading menu...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("menu_items")
      .select(
        "id,restaurant_id,name,description,price,image_url,available,created_at,category"
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    box.innerHTML =
      '<div class="message error">' +
      error.message +
      '</div>';

    return;

  }


  menuItems =
    data || [];


  document
    .getElementById(
      "menuCount"
    )
    .textContent =
    menuItems.length;


  displayAdminMenu(
    menuItems
  );

}


/* =========================================
   DISPLAY MENU
========================================= */

function displayAdminMenu(items){

  const box =
    document.getElementById(
      "adminMenuList"
    );

  box.innerHTML = "";


  if(items.length === 0){

    box.innerHTML =
      '<div class="message info">' +
      'No menu items yet.' +
      '</div>';

    return;

  }


  items.forEach(function(item){

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "menu-card";


    card.innerHTML = `

      ${
        item.image_url
        ?
        `<img
          class="image-preview"
          src="${escapeHTML(item.image_url)}"
          onerror="this.style.display='none'"
        >`
        :
        ""
      }

      <h3>
        ${escapeHTML(item.name)}
      </h3>

      <p class="menu-description">
        ${escapeHTML(
          item.description || ""
        )}
      </p>

      <p class="menu-price">
        KSh ${Number(
          item.price || 0
        ).toLocaleString()}
      </p>

      <p class="${
        item.available
        ? "available"
        : "unavailable"
      }">

        ${
          item.available
          ? "✅ Available"
          : "❌ Not Available"
        }

      </p>

      <br>

      <div class="menu-actions">

        <button
          class="primary"
          onclick="editMenu(${item.id})"
        >
          ✏️ Edit
        </button>

        <button
          class="${
            item.available
            ? "secondary"
            : "success"
          }"
          onclick="toggleAvailability(
            ${item.id},
            ${item.available}
          )"
        >
          ${
            item.available
            ? "❌ Hide"
            : "✅ Show"
          }
        </button>

        <button
          class="danger"
          onclick="deleteMenu(${item.id})"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    box.appendChild(card);

  });

}


/* =========================================
   SEARCH MENU
========================================= */

function filterAdminMenu(){

  const term =
    document
      .getElementById(
        "menuAdminSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    menuItems.filter(
      function(item){

        return (

          String(
            item.name || ""
          )
          .toLowerCase()
          .includes(term)

          ||

          String(
            item.category || ""
          )
          .toLowerCase()
          .includes(term)

        );

      }
    );


  displayAdminMenu(
    filtered
  );

}


/* =========================================
   SAVE MENU
========================================= */

async function saveMenuItem(){

  const id =
    document
      .getElementById(
        "editId"
      )
      .value;


  const name =
    document
      .getElementById(
        "itemName"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "itemPrice"
        )
        .value
    );


  const description =
    document
      .getElementById(
        "itemDescription"
      )
      .value
      .trim();


  const category =
    document
      .getElementById(
        "itemCategory"
      )
      .value
      .trim();


  const image_url =
    document
      .getElementById(
        "itemImage"
      )
      .value
      .trim();


  const available =
    document
      .getElementById(
        "itemAvailable"
      )
      .checked;


  if(!name){

    alert(
      "Please enter the menu name."
    );

    return;

  }


  if(!price || price < 0){

    alert(
      "Please enter a valid price."
    );

    return;

  }


  const itemData = {

    restaurant_id:
      RESTAURANT_ID,

    name:name,

    description:
      description || null,

    price:price,

    image_url:
      image_url || null,

    available:
      available,

    category:
      category || null

  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("menu_items")
        .update(itemData)
        .eq(
          "id",
          id
        )
        .eq(
          "restaurant_id",
          RESTAURANT_ID
        );

  }else{

    result =
      await supabaseClient
        .from("menu_items")
        .insert(
          itemData
        );

  }


  if(result.error){

    console.error(
      result.error
    );

    showMessage(
      "Could not save menu item: " +
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    id
    ? "Menu item updated successfully."
    : "Menu item added successfully.",
    "success-message"
  );


  clearForm();

  await loadMenu();

  showPanel(
    "menu",
    document.querySelectorAll(".tab")[1]
  );

}


/* =========================================
   EDIT MENU
========================================= */

function editMenu(id){

  const item =
    menuItems.find(
      function(x){
        return x.id === id;
      }
    );


  if(!item){

    return;

  }


  document
    .getElementById(
      "editId"
    )
    .value =
    item.id;


  document
    .getElementById(
      "itemName"
    )
    .value =
    item.name || "";


  document
    .getElementById(
      "itemPrice"
    )
    .value =
    item.price || "";


  document
    .getElementById(
      "itemDescription"
    )
    .value =
    item.description || "";


  document
    .getElementById(
      "itemCategory"
    )
    .value =
    item.category || "";


  document
    .getElementById(
      "itemImage"
    )
    .value =
    item.image_url || "";


  document
    .getElementById(
      "itemAvailable"
    )
    .checked =
    item.available;


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "✏️ Edit Menu Item";


  showPanel(
    "add",
    document.querySelectorAll(".tab")[2]
  );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

  document
    .getElementById(
      "editId"
    )
    .value = "";


  document
    .getElementById(
      "itemName"
    )
    .value = "";


  document
    .getElementById(
      "itemPrice"
    )
    .value = "";


  document
    .getElementById(
      "itemDescription"
    )
    .value = "";


  document
    .getElementById(
      "itemCategory"
    )
    .value = "";


  document
    .getElementById(
      "itemImage"
    )
    .value = "";


  document
    .getElementById(
      "itemAvailable"
    )
    .checked = true;


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "➕ Add Menu Item";

}


/* =========================================
   TOGGLE AVAILABILITY
========================================= */

async function toggleAvailability(
  id,
  current
){

  const {
    error
  } =
    await supabaseClient
      .from("menu_items")
      .update({
        available:!current
      })
      .eq(
        "id",
        id
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(error){

    showMessage(
      "Could not update item: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Menu availability updated.",
    "success-message"
  );


  loadMenu();

}


/* =========================================
   DELETE MENU
========================================= */

async function deleteMenu(id){

  const confirmDelete =
    confirm(
      "Are you sure you want to delete this menu item?"
    );


  if(!confirmDelete){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("menu_items")
      .delete()
      .eq(
        "id",
        id
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(error){

    showMessage(
      "Could not delete item: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Menu item deleted.",
    "success-message"
  );


  loadMenu();

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const loading =
    document.getElementById(
      "ordersLoading"
    );

  const box =
    document.getElementById(
      "ordersList"
    );


  loading.classList.remove(
    "hidden"
  );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("*")
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  loading.classList.add(
    "hidden"
  );


  if(error){

    box.innerHTML =
      '<div class="message error">' +
      escapeHTML(error.message) +
      '</div>';

    return;

  }


  orders =
    data || [];


  document
    .getElementById(
      "totalOrders"
    )
    .textContent =
    orders.length;


  const pending =
    orders.filter(
      function(order){

        return String(
          order.status || ""
        )
        .toLowerCase()
        ===
        "pending";

      }
    ).length;


  document
    .getElementById(
      "pendingOrders"
    )
    .textContent =
    pending;


  const sales =
    orders.reduce(
      function(sum,order){

        const status =
          String(
            order.status || ""
          ).toLowerCase();

        if(
          status !== "cancelled"
        ){

          return sum +
            Number(
              order.total_amount ||
              order.total ||
              0
            );

        }

        return sum;

      },
      0
    );


  document
    .getElementById(
      "salesTotal"
    )
    .textContent =
    "KSh " +
    sales.toLocaleString();


  displayOrders();

}


/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders(){

  const box =
    document.getElementById(
      "ordersList"
    );

  box.innerHTML = "";


  if(orders.length === 0){

    box.innerHTML =
      '<div class="message info">' +
      'No orders yet.' +
      '</div>';

    return;

  }


  orders.forEach(
    function(order){

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "order";


      const status =
        String(
          order.status ||
          "pending"
        )
        .toLowerCase();


      const total =
        Number(
          order.total_amount ||
          order.total ||
          0
        );


      const date =
        order.created_at
        ?
        new Date(
          order.created_at
        ).toLocaleString()
        :
        "";


      div.innerHTML = `

        <div class="order-top">

          <strong>
            📦 Order #${escapeHTML(
              order.id
            )}
          </strong>

          <span class="status ${status}">
            ${escapeHTML(
              order.status ||
              "pending"
            )}
          </span>

        </div>

        <p>
          🕐 ${escapeHTML(date)}
        </p>

        <div class="order-items">

          <strong>
            Order Total
          </strong>

          <br>

          KSh ${total.toLocaleString()}

        </div>

        <div class="order-actions">

          ${
            status === "pending"
            ?
            `<button
              class="primary"
              onclick="changeOrderStatus(${order.id},'preparing')"
            >
              👨‍🍳 Start Preparing
            </button>`
            :
            ""
          }

          ${
            status === "preparing"
            ?
            `<button
              class="success"
              onclick="changeOrderStatus(${order.id},'ready')"
            >
              ✅ Mark Ready
            </button>`
            :
            ""
          }

          ${
            status === "ready"
            ?
            `<button
              class="success"
              onclick="changeOrderStatus(${order.id},'completed')"
            >
              🏁 Complete
            </button>`
            :
            ""
          }

          ${
            status !== "completed" &&
            status !== "cancelled"
            ?
            `<button
              class="danger"
              onclick="changeOrderStatus(${order.id},'cancelled')"
            >
              ❌ Cancel
            </button>`
            :
            ""
          }

        </div>

      `;


      box.appendChild(div);

    }
  );

}


/* =========================================
   CHANGE ORDER STATUS
========================================= */

async function changeOrderStatus(
  id,
  status
){

  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(error){

    showMessage(
      "Could not update order: " +
      error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Order updated to " +
    status +
    ".",
    "success-message"
  );


  loadOrders();

}


/* =========================================
   TABS
========================================= */

function showPanel(
  panel,
  button
){

  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      function(p){
        p.classList.remove(
          "active"
        );
      }
    );


  document
    .getElementById(
      panel + "Panel"
    )
    .classList.add(
      "active"
    );


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      function(t){
        t.classList.remove(
          "active"
        );
      }
    );


  if(button){

    button.classList.add(
      "active"
    );

  }

}


/* =========================================
   REFRESH
========================================= */

async function refreshAll(){

  await loadRestaurant();

  await loadMenu();

  await loadOrders();

  showMessage(
    "Dashboard refreshed.",
    "success-message"
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

async function startDashboard(){

  await loadRestaurant();

  await loadMenu();

  await loadOrders();

}


startDashboard();
