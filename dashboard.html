<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MloHub - Restaurant Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f6f9;
  color:#222;
}

header{
  background:linear-gradient(135deg,#ff7a00,#ff3d00);
  color:white;
  padding:20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:26px;
  font-weight:bold;
}

.restaurant-name{
  margin-top:5px;
  opacity:.95;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.message{
  padding:14px;
  border-radius:10px;
  margin-bottom:18px;
  display:none;
}

.message.show{
  display:block;
}

.info{
  background:#e7f1ff;
  color:#084298;
}

.error{
  background:#f8d7da;
  color:#842029;
}

.success-message{
  background:#d1e7dd;
  color:#0f5132;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-icon{
  font-size:28px;
}

.stat h3{
  margin:8px 0;
  font-size:27px;
}

.stat p{
  color:#777;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  overflow:auto;
}

.tab{
  border:0;
  background:white;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
}

.tab.active{
  background:#ff5a00;
  color:white;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
  margin-bottom:18px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
  margin-bottom:12px;
}

button{
  cursor:pointer;
}

.primary{
  background:#ff5a00;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  background:#eee;
  border:0;
  padding:11px 16px;
  border-radius:9px;
}

.success{
  background:#168c39;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

.danger{
  background:#dc3545;
  color:white;
  border:0;
  padding:11px 16px;
  border-radius:9px;
}

.menu-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.menu-card{
  border:1px solid #eee;
  border-radius:13px;
  padding:16px;
  background:#fff;
}

.menu-card h3{
  margin-bottom:7px;
}

.menu-description{
  color:#777;
  font-size:14px;
  margin-bottom:10px;
}

.menu-price{
  color:#e84d00;
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
}

.menu-category{
  color:#666;
  font-size:13px;
  margin-bottom:10px;
}

.menu-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.image-preview{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
}

.available{
  color:#168c39;
  font-weight:bold;
}

.unavailable{
  color:#dc3545;
  font-weight:bold;
}

.order{
  border:1px solid #eee;
  border-radius:14px;
  padding:17px;
  margin-bottom:13px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.order-info{
  line-height:1.7;
}

.order-items{
  background:#f8f8f8;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}

.status{
  display:inline-block;
  padding:6px 11px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.pending{
  background:#fff3cd;
  color:#856404;
}

.preparing{
  background:#cfe2ff;
  color:#084298;
}

.ready{
  background:#d1e7dd;
  color:#0f5132;
}

.completed{
  background:#d1e7dd;
  color:#0f5132;
}

.cancelled{
  background:#f8d7da;
  color:#842029;
}

.order-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.loading{
  padding:20px;
  text-align:center;
  color:#777;
}

.empty{
  padding:25px;
  text-align:center;
  color:#777;
  background:#f8f8f8;
  border-radius:10px;
}

@media(max-width:800px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }

  .logo{
    font-size:21px;
  }

}
</style>

</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ALBAIK
========================================= */

const RESTAURANT_ID = 2;

let restaurant = null;

let menuItems = [];

let orders = [];


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.className =
    "message show " + type;

  box.textContent =
    text;

  setTimeout(function(){

    box.className =
      "message";

    box.textContent =
      "";

  },4000);

}


/* =========================================
   RESTAURANT
========================================= */

async function loadRestaurant(){

  const result =
    await supabaseClient
      .from("restaurants")
      .select("*")
      .eq("id",RESTAURANT_ID)
      .single();

  if(result.error){

    console.error(result.error);

    showMessage(
      "Could not load restaurant: " +
      result.error.message,
      "error"
    );

    return;

  }

  restaurant =
    result.data;

  document.getElementById(
    "restaurantTitle"
  ).textContent =
    restaurant.name +
    " Dashboard";

}


/* =========================================
   MENU
========================================= */

async function loadMenu(){

  const box =
    document.getElementById(
      "adminMenuList"
    );

  box.innerHTML =
    '<div class="loading">Loading menu...</div>';


  const result =
    await supabaseClient
      .from("menu_items")
      .select(
        "id,restaurant_id,name,description,price,image_url,available,created_at,category"
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(result.error){

    console.error(result.error);

    box.innerHTML =
      '<div class="message show error">' +
      escapeHTML(result.error.message) +
      '</div>';

    return;

  }


  menuItems =
    result.data || [];


  document.getElementById(
    "menuCount"
  ).textContent =
    menuItems.length;


  displayAdminMenu(
    menuItems
  );

}


/* =========================================
   DISPLAY MENU
========================================= */

function displayAdminMenu(items){

  const box =
    document.getElementById(
      "adminMenuList"
    );

  box.innerHTML = "";


  if(!items.length){

    box.innerHTML =
      '<div class="empty">' +
      'No menu items yet.' +
      '</div>';

    return;

  }


  items.forEach(function(item){

    const card =
      document.createElement("div");

    card.className =
      "menu-card";


    let imageHTML = "";

    if(item.image_url){

      imageHTML = `
        <img
          class="image-preview"
          src="${escapeHTML(item.image_url)}"
          onerror="this.style.display='none'"
          alt="${escapeHTML(item.name)}"
        >
      `;

    }


    card.innerHTML = `

      ${imageHTML}

      <h3>
        ${escapeHTML(item.name)}
      </h3>

      <p class="menu-description">
        ${escapeHTML(item.description || "")}
      </p>

      <p class="menu-category">
        📂 ${escapeHTML(item.category || "Other")}
      </p>

      <p class="menu-price">
        KSh ${Number(item.price || 0).toLocaleString()}
      </p>

      <p class="${
        item.available
        ? "available"
        : "unavailable"
      }">

        ${
          item.available
          ? "✅ Available"
          : "❌ Not Available"
        }

      </p>

      <br>

      <div class="menu-actions">

        <button
          class="primary"
          onclick="editMenu(${Number(item.id)})"
        >
          ✏️ Edit
        </button>

        <button
          class="${
            item.available
            ? "secondary"
            : "success"
          }"
          onclick="toggleAvailability(
            ${Number(item.id)},
            ${item.available}
          )"
        >

          ${
            item.available
            ? "❌ Hide"
            : "✅ Show"
          }

        </button>

        <button
          class="danger"
          onclick="deleteMenu(${Number(item.id)})"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    box.appendChild(card);

  });

}


/* =========================================
   SEARCH
========================================= */

function filterAdminMenu(){

  const term =
    document.getElementById(
      "menuAdminSearch"
    ).value
    .toLowerCase()
    .trim();


  const filtered =
    menuItems.filter(function(item){

      return (

        String(item.name || "")
          .toLowerCase()
          .includes(term)

        ||

        String(item.category || "")
          .toLowerCase()
          .includes(term)

      );

    });


  displayAdminMenu(filtered);

}


/* =========================================
   SAVE MENU
========================================= */

async function saveMenuItem(){

  const id =
    document.getElementById(
      "editId"
    ).value;


  const name =
    document.getElementById(
      "itemName"
    ).value
    .trim();


  const price =
    Number(
      document.getElementById(
        "itemPrice"
      ).value
    );


  const description =
    document.getElementById(
      "itemDescription"
    ).value
    .trim();


  const category =
    document.getElementById(
      "itemCategory"
    ).value
    .trim();


  const image_url =
    document.getElementById(
      "itemImage"
    ).value
    .trim();


  const available =
    document.getElementById(
      "itemAvailable"
    ).checked;


  if(!name){

    alert(
      "Please enter the menu name."
    );

    return;

  }


  if(isNaN(price) || price < 0){

    alert(
      "Please enter a valid price."
    );

    return;

  }


  const itemData = {

    restaurant_id:
      RESTAURANT_ID,

    name:
      name,

    description:
      description || null,

    price:
      price,

    image_url:
      image_url || null,

    available:
      available,

    category:
      category || null

  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("menu_items")
        .update(itemData)
        .eq("id",id)
        .eq(
          "restaurant_id",
          RESTAURANT_ID
        );

  }else{

    result =
      await supabaseClient
        .from("menu_items")
        .insert(itemData);

  }


  if(result.error){

    console.error(result.error);

    showMessage(
      "Could not save menu item: " +
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    id
      ? "Menu item updated successfully."
      : "Menu item added successfully.",
    "success-message"
  );


  clearForm();

  await loadMenu();

  showPanel(
    "menu",
    document.querySelectorAll(".tab")[1]
  );

}


/* =========================================
   EDIT MENU
========================================= */

function editMenu(id){

  const item =
    menuItems.find(function(x){

      return Number(x.id) === Number(id);

    });


  if(!item){

    showMessage(
      "Menu item not found.",
      "error"
    );

    return;

  }


  document.getElementById(
    "editId"
  ).value =
    item.id;


  document.getElementById(
    "itemName"
  ).value =
    item.name || "";


  document.getElementById(
    "itemPrice"
  ).value =
    item.price || "";


  document.getElementById(
    "itemDescription"
  ).value =
    item.description || "";


  document.getElementById(
    "itemCategory"
  ).value =
    item.category || "";


  document.getElementById(
    "itemImage"
  ).value =
    item.image_url || "";


  document.getElementById(
    "itemAvailable"
  ).checked =
    item.available;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Menu Item";


  showPanel(
    "add",
    document.querySelectorAll(".tab")[2]
  );

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

  document.getElementById(
    "editId"
  ).value = "";


  document.getElementById(
    "itemName"
  ).value = "";


  document.getElementById(
    "itemPrice"
  ).value = "";


  document.getElementById(
    "itemDescription"
  ).value = "";


  document.getElementById(
    "itemCategory"
  ).value = "";


  document.getElementById(
    "itemImage"
  ).value = "";


  document.getElementById(
    "itemAvailable"
  ).checked = true;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add Menu Item";

}


/* =========================================
   AVAILABILITY
========================================= */

async function toggleAvailability(
  id,
  current
){

  const result =
    await supabaseClient
      .from("menu_items")
      .update({
        available:!current
      })
      .eq("id",id)
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(result.error){

    showMessage(
      "Could not update item: " +
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Menu availability updated.",
    "success-message"
  );


  await loadMenu();

}


/* =========================================
   DELETE MENU
========================================= */

async function deleteMenu(id){

  if(!confirm(
    "Are you sure you want to delete this menu item?"
  )){

    return;

  }


  const result =
    await supabaseClient
      .from("menu_items")
      .delete()
      .eq("id",id)
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(result.error){

    showMessage(
      "Could not delete item: " +
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Menu item deleted.",
    "success-message"
  );


  await loadMenu();

}


/* =========================================
   ORDERS
========================================= */

async function loadOrders(){

  const loading =
    document.getElementById(
      "ordersLoading"
    );

  const box =
    document.getElementById(
      "ordersList"
    );


  loading.style.display =
    "block";


  const result =
    await supabaseClient
      .from("orders")
      .select(
        "id,restaurant_id,customer_name,customer_phone,delivery_address,order_status,total_amount,created_at,customer_id"
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      )
      .order(
        "created_at",
        {ascending:false}
      );


  loading.style.display =
    "none";


  if(result.error){

    console.error(result.error);

    box.innerHTML =
      '<div class="message show error">' +
      escapeHTML(result.error.message) +
      '</div>';

    return;

  }


  orders =
    result.data || [];


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  const pending =
    orders.filter(function(order){

      return String(
        order.order_status || ""
      ).toLowerCase()
      ===
      "pending";

    }).length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending;


  const sales =
    orders.reduce(
      function(total,order){

        const status =
          String(
            order.order_status || ""
          ).toLowerCase();


        if(status !== "cancelled"){

          return total +
            Number(
              order.total_amount || 0
            );

        }


        return total;

      },
      0
    );


  document.getElementById(
    "salesTotal"
  ).textContent =
    "KSh " +
    sales.toLocaleString();


  displayOrders();

}


/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders(){

  const box =
    document.getElementById(
      "ordersList"
    );

  box.innerHTML = "";


  if(!orders.length){

    box.innerHTML =
      '<div class="empty">' +
      'No orders yet.' +
      '</div>';

    return;

  }


  orders.forEach(function(order){

    const div =
      document.createElement("div");

    div.className =
      "order";


    const status =
      String(
        order.order_status ||
        "pending"
      ).toLowerCase();


    const total =
      Number(
        order.total_amount || 0
      );


    const date =
      order.created_at
      ?
      new Date(
        order.created_at
      ).toLocaleString()
      :
      "";


    div.innerHTML = `

      <div class="order-top">

        <strong>
          📦 Order #${escapeHTML(order.id)}
        </strong>

        <span class="status ${escapeHTML(status)}">
          ${escapeHTML(
            order.order_status || "pending"
          )}
        </span>

      </div>


      <div class="order-info">

        <div>
          👤 <strong>Customer:</strong>
          ${escapeHTML(
            order.customer_name || "Customer"
          )}
        </div>

        <div>
          📞 <strong>Phone:</strong>
          ${escapeHTML(
            order.customer_phone || "Not provided"
          )}
        </div>

        <div>
          📍 <strong>Delivery:</strong>
          ${escapeHTML(
            order.delivery_address || "Not provided"
          )}
        </div>

        <div>
          🕐 <strong>Time:</strong>
          ${escapeHTML(date)}
        </div>

      </div>


      <div class="order-items">

        <strong>
          💰 Order Total
        </strong>

        <br><br>

        KSh ${total.toLocaleString()}

      </div>


      <div class="order-actions">

        ${
          status === "pending"
          ?
          `
          <button
            class="primary"
            onclick="changeOrderStatus(
              ${Number(order.id)},
              'preparing'
            )"
          >
            👨‍🍳 Start Preparing
          </button>
          `
          :
          ""
        }


        ${
          status === "preparing"
          ?
          `
          <button
            class="success"
            onclick="changeOrderStatus(
              ${Number(order.id)},
              'ready'
            )"
          >
            ✅ Mark Ready
          </button>
          `
          :
          ""
        }


        ${
          status === "ready"
          ?
          `
          <button
            class="success"
            onclick="changeOrderStatus(
              ${Number(order.id)},
              'completed'
            )"
          >
            🏁 Complete
          </button>
          `
          :
          ""
        }


        ${
          status !== "completed" &&
          status !== "cancelled"
          ?
          `
          <button
            class="danger"
            onclick="changeOrderStatus(
              ${Number(order.id)},
              'cancelled'
            )"
          >
            ❌ Cancel
          </button>
          `
          :
          ""
        }

      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================================
   CHANGE ORDER STATUS
========================================= */

async function changeOrderStatus(
  id,
  newStatus
){

  const result =
    await supabaseClient
      .from("orders")
      .update({
        order_status:newStatus
      })
      .eq(
        "id",
        id
      )
      .eq(
        "restaurant_id",
        RESTAURANT_ID
      );


  if(result.error){

    console.error(result.error);

    showMessage(
      "Could not update order: " +
      result.error.message,
      "error"
    );

    return;

  }


  showMessage(
    "Order #" +
    id +
    " updated to " +
    newStatus +
    ".",
    "success-message"
  );


  await loadOrders();

}


/* =========================================
   TABS
========================================= */

function showPanel(
  panel,
  button
){

  document
    .querySelectorAll(".panel")
    .forEach(function(p){

      p.classList.remove("active");

    });


  document.getElementById(
    panel + "Panel"
  ).classList.add("active");


  document
    .querySelectorAll(".tab")
    .forEach(function(t){

      t.classList.remove("active");

    });


  if(button){

    button.classList.add("active");

  }

}


/* =========================================
   REFRESH
========================================= */

async function refreshAll(){

  await loadRestaurant();

  await loadMenu();

  await loadOrders();

  showMessage(
    "Dashboard refreshed successfully.",
    "success-message"
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

async function startDashboard(){

  await loadRestaurant();

  await loadMenu();

  await loadOrders();

}


startDashboard();
