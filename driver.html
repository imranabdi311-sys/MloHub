<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MloHub Driver Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:linear-gradient(135deg,#ff6500,#ff9d00);
  color:white;
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.subtitle{
  font-size:14px;
  opacity:.9;
}

header a{
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.2);
  padding:10px 15px;
  border-radius:8px;
}

.container{
  width:94%;
  max-width:1200px;
  margin:25px auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  margin-bottom:20px;
}

select{
  width:100%;
  max-width:500px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
  background:white;
}

button{
  border:none;
  cursor:pointer;
  border-radius:8px;
  font-weight:bold;
  padding:11px 16px;
}

.refresh{
  background:#222;
  color:white;
  margin-top:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat span{
  color:#777;
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:8px;
  color:#ff6500;
}

.orders{
  display:grid;
  gap:18px;
}

.order{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
  border-left:5px solid #ff6500;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.order-number{
  font-size:21px;
  font-weight:bold;
}

.time{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.ready{
  background:#e4f8ea;
  color:#17833b;
}

.assigned{
  background:#e4f8f7;
  color:#087b76;
}

.picked{
  background:#e4f0ff;
  color:#1769aa;
}

.delivered{
  background:#dff7e5;
  color:#08752a;
}

.details{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:18px;
}

.detail{
  background:#f8f8f8;
  padding:14px;
  border-radius:9px;
}

.detail small{
  display:block;
  color:#777;
  margin-bottom:5px;
}

.detail strong{
  word-break:break-word;
}

.items{
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:15px 0;
  margin-bottom:18px;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  gap:10px;
}

.total{
  font-size:21px;
  font-weight:bold;
  color:#ff6500;
  margin-bottom:18px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.actions button,
.actions a{
  padding:11px 14px;
  border-radius:8px;
  text-decoration:none;
  color:white;
  display:inline-block;
  font-size:14px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.accept{
  background:#087b76;
}

.pickup{
  background:#1769aa;
}

.deliver{
  background:#08752a;
}

.call{
  background:#222;
}

.whatsapp{
  background:#25D366;
}

.empty,
.loading,
.error{
  background:white;
  padding:35px;
  text-align:center;
  border-radius:12px;
  color:#777;
}

.error{
  color:#b00020;
}

@media(max-width:600px){
  .order{
    padding:15px;
  }
}
</style>

</head>

<body>

<header>

<div>
  <div class="logo">MloHub</div>
  <div class="subtitle">Driver Dashboard 🛵</div>
</div>

<a href="index.html">← Customer Site</a>

</header>

<main class="container">

<div class="card">

<h2>Select Driver</h2>

<br>

<select id="driverSelect" onchange="driverChanged()">
<option value="">Loading drivers...</option>
</select>

<br>

<button class="refresh" onclick="loadOrders()">
🔄 Refresh Orders
</button>

</div>

<div class="stats">

<div class="stat">
<span>Available</span>
<strong id="availableCount">0</strong>
</div>

<div class="stat">
<span>My Deliveries</span>
<strong id="myCount">0</strong>
</div>

<div class="stat">
<span>Picked Up</span>
<strong id="pickedCount">0</strong>
</div>

<div class="stat">
<span>Delivered</span>
<strong id="deliveredCount">0</strong>
</div>

</div>

<h2 style="margin-bottom:15px;">
Delivery Orders
</h2>

<div id="orders" class="orders">

<div class="empty">
Select a driver to view deliveries.
</div>

</div>

</main>

<script>

const SUPABASE_URL =
"https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


let drivers = [];

let currentDriverId = null;

let orders = [];


document.addEventListener(
"DOMContentLoaded",
loadDrivers
);


async function loadDrivers(){

const select =
document.getElementById(
"driverSelect"
);

select.innerHTML =
`<option value="">
Loading drivers...
</option>`;


const {
data,
error
} =
await supabaseClient
.from("drivers")
.select("*")
.order("id");


if(error){

console.error(error);

select.innerHTML =
`<option value="">
Error loading drivers
</option>`;

document.getElementById(
"orders"
).innerHTML =
`<div class="error">
${escapeHtml(error.message)}
</div>`;

return;
}


drivers = data || [];


if(!drivers.length){

select.innerHTML =
`<option value="">
No drivers found
</option>`;

return;
}


select.innerHTML =
`<option value="">
Select driver...
</option>` +
drivers.map(driver => `

<option value="${driver.id}">
${escapeHtml(
driver.name ||
driver.full_name ||
"Driver #" + driver.id
)}
</option>

`).join("");


select.value =
drivers[0].id;

currentDriverId =
drivers[0].id;

await loadOrders();

}


function driverChanged(){

const select =
document.getElementById(
"driverSelect"
);

currentDriverId =
select.value || null;

loadOrders();

}


async function loadOrders(){

const container =
document.getElementById(
"orders"
);


if(!currentDriverId){

container.innerHTML =
`<div class="empty">
Select a driver first.
</div>`;

return;
}


container.innerHTML =
`<div class="loading">
Loading deliveries...
</div>`;


const {
data,
error
} =
await supabaseClient
.from("orders")
.select("*")
.or(
`order_status.eq.ready,driver_id.eq.${currentDriverId}`
)
.eq(
"order_type",
"delivery"
)
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

container.innerHTML =
`<div class="error">
<strong>
Unable to load deliveries
</strong>
<br><br>
${escapeHtml(error.message)}
</div>`;

return;
}


orders = data || [];


for(const order of orders){

order.items =
await loadOrderItems(order.id);

}


updateStats();

renderOrders();

}


async function loadOrderItems(orderId){

const {
data,
error
} =
await supabaseClient
.from("order_items")
.select("*")
.eq(
"order_id",
orderId
);


if(error){

console.error(error);

return [];

}


const items =
data || [];


for(const item of items){

const {
data:menu
} =
await supabaseClient
.from("menu_items")
.select("name")
.eq(
"id",
item.menu_item_id
)
.maybeSingle();


item.menu_name =
menu
? menu.name
: "Menu item";

}


return items;

}


function renderOrders(){

const container =
document.getElementById(
"orders"
);


if(!orders.length){

container.innerHTML =
`<div class="empty">

<div style="font-size:40px;">
🛵
</div>

<br>

No delivery orders available.

</div>`;

return;

}


container.innerHTML =
orders.map(
order => createOrder(order)
).join("");

}


function createOrder(order){

const status =
order.order_status ||
"ready";


const phone =
order.customer_phone ||
"";


const cleanPhone =
phone
.toString()
.replace(/\D/g,"");


const items =
order.items || [];


const itemsHtml =
items.length

? items.map(item => `

<div class="item">

<span>
${item.quantity} ×
${escapeHtml(
item.menu_name
)}
</span>

<strong>
KSh
${formatMoney(
Number(item.price || 0) *
Number(item.quantity || 0)
)}
</strong>

</div>

`).join("")

: "No items found.";


const time =
order.created_at
? new Date(
order.created_at
).toLocaleString("en-KE")
: "";


let action = "";


if(status === "ready"){

action = `

<button
class="accept"
onclick="acceptDelivery(${order.id})"
>
🛵 Accept Delivery
</button>

`;

}


if(
status === "assigned" &&
Number(order.driver_id) ===
Number(currentDriverId)
){

action = `

<button
class="pickup"
onclick="updateStatus(
${order.id},
'picked_up'
)"
>
📦 Picked Up
</button>

`;

}


if(
status === "picked_up" &&
Number(order.driver_id) ===
Number(currentDriverId)
){

action = `

<button
class="deliver"
onclick="updateStatus(
${order.id},
'delivered'
)"
>
✓ Delivered
</button>

`;

}


return `

<div class="order">

<div class="order-top">

<div>

<div class="order-number">
Order #${order.id}
</div>

<div class="time">
${escapeHtml(time)}
</div>

</div>

<div class="status ${status}">
${formatStatus(status)}
</div>

</div>


<div class="details">


<div class="detail">

<small>
Customer
</small>

<strong>
${escapeHtml(
order.customer_name ||
"Customer"
)}
</strong>

</div>


<div class="detail">

<small>
Phone
</small>

<strong>
${escapeHtml(
phone ||
"Not provided"
)}
</strong>

</div>


<div class="detail">

<small>
Delivery Address
</small>

<strong>
${escapeHtml(
order.delivery_address ||
"Not provided"
)}
</strong>

</div>


<div class="detail">

<small>
Payment
</small>

<strong>
${
order.payment_method === "mpesa"
? "📱 M-Pesa"
: "💵 Cash"
}
</strong>

</div>


</div>


<div class="items">

<h3>
🍔 Order Items
</h3>

${itemsHtml}

</div>


<div class="total">

Order Total:
KSh
${formatMoney(
order.total_amount
)}

</div>


<div class="actions">

${action}


${
cleanPhone
? `

<a
class="call"
href="tel:+${cleanPhone}"
>
📞 Call
</a>

<a
class="whatsapp"
href="https://wa.me/${cleanPhone}"
target="_blank"
>
💬 WhatsApp
</a>

`
: ""
}


</div>


</div>

`;

}


async function acceptDelivery(orderId){

if(!currentDriverId){

alert(
"Please select a driver first."
);

return;

}


const confirmed =
confirm(
"Accept this delivery?"
);


if(!confirmed){
return;
}


const {
error
} =
await supabaseClient
.from("orders")
.update({

driver_id:
currentDriverId,

order_status:
"assigned"

})
.eq(
"id",
orderId
)
.eq(
"order_status",
"ready"
);


if(error){

console.error(error);

alert(
"Could not accept delivery:\n\n" +
error.message
);

return;

}


await loadOrders();

}


async function updateStatus(
orderId,
status
){

const confirmed =
confirm(
"Change this order to " +
formatStatus(status) +
"? "
);


if(!confirmed){
return;
}


const {
error
} =
await supabaseClient
.from("orders")
.update({

order_status:
status

})
.eq(
"id",
orderId
)
.eq(
"driver_id",
currentDriverId
);


if(error){

console.error(error);

alert(
"Could not update order:\n\n" +
error.message
);

return;

}


await loadOrders();

}


function updateStats(){

const available =
orders.filter(
o =>
o.order_status ===
"ready"
).length;


const mine =
orders.filter(
o =>
Number(o.driver_id) ===
Number(currentDriverId) &&
o.order_status !==
"delivered"
).length;


const picked =
orders.filter(
o =>
Number(o.driver_id) ===
Number(currentDriverId) &&
o.order_status ===
"picked_up"
).length;


const delivered =
orders.filter(
o =>
Number(o.driver_id) ===
Number(currentDriverId) &&
o.order_status ===
"delivered"
).length;


document.getElementById(
"availableCount"
).textContent =
available;


document.getElementById(
"myCount"
).textContent =
mine;


document.getElementById(
"pickedCount"
).textContent =
picked;


document.getElementById(
"deliveredCount"
).textContent =
delivered;

}


function formatStatus(status){

return String(status || "")
.replace(/_/g," ")
.replace(
/\b\w/g,
letter =>
letter.toUpperCase()
);

}


function formatMoney(amount){

return Number(
amount || 0
).toLocaleString("en-KE");

}


function escapeHtml(value){

return String(
value ?? ""
)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


setInterval(
() => {

if(currentDriverId){
loadOrders();
}

},
15000
);

</script>

</body>
</html>
