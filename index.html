<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   GLOBAL DATA
========================================= */

let restaurants = [];

let currentRestaurant = null;

let carts = {};


/* =========================================
   START
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadRestaurants();

  }
);


/* =========================================
   LOAD ALL RESTAURANTS
========================================= */

async function loadRestaurants(){

  const buttons =
    document.getElementById(
      "restaurantButtons"
    );

  const container =
    document.getElementById(
      "restaurantsContainer"
    );

  buttons.innerHTML =
    '<div class="loading">Loading restaurants...</div>';

  container.innerHTML = "";


  const { data, error } =
    await supabaseClient

      .from("restaurants")

      .select("*")

      .order("id",{
        ascending:true
      });


  if(error){

    console.error(
      "Restaurant loading error:",
      error
    );

    buttons.innerHTML =
      '<div class="error">' +
      'Unable to load restaurants.<br><br>' +
      escapeHTML(error.message) +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    buttons.innerHTML =
      '<div class="empty">' +
      'No restaurants available.' +
      '</div>';

    return;
  }


  restaurants = data;


  data.forEach(function(restaurant){

    carts[restaurant.id] = [];

  });


  buttons.innerHTML = "";


  data.forEach(function(restaurant,index){

    const button =
      document.createElement("button");

    button.textContent =
      "🍽️ " + restaurant.name;

    button.onclick =
      function(){

        showRestaurant(
          restaurant.id
        );

      };

    buttons.appendChild(button);

  });


  renderRestaurants();


  if(data.length > 0){

    showRestaurant(data[0].id);

  }

}


/* =========================================
   RENDER RESTAURANTS
========================================= */

function renderRestaurants(){

  const container =
    document.getElementById(
      "restaurantsContainer"
    );

  container.innerHTML = "";


  restaurants.forEach(function(restaurant){

    const box =
      document.createElement("div");

    box.className = "restaurant";

    box.id =
      "restaurant-" +
      restaurant.id;

    box.style.display = "none";


    box.innerHTML = `

      <h2>
        🍽️ ${escapeHTML(
          restaurant.name || "Restaurant"
        )}
      </h2>

      <p class="location">
        ${escapeHTML(
          restaurant.address ||
          restaurant.location ||
          "Nairobi"
        )}
      </p>

      <div class="restaurant-note">
        📍 Ordering from
        ${escapeHTML(
          restaurant.name || "Restaurant"
        )}
      </div>

      <div id="menu-${restaurant.id}">
        <div class="loading">
          Loading menu...
        </div>
      </div>

    `;


    container.appendChild(box);

  });

}


/* =========================================
   SHOW RESTAURANT
========================================= */

async function showRestaurant(
  restaurantId
){

  const restaurant =
    restaurants.find(
      r => Number(r.id) === Number(restaurantId)
    );


  if(!restaurant) return;


  currentRestaurant =
    restaurant;


  restaurants.forEach(function(r){

    const box =
      document.getElementById(
        "restaurant-" + r.id
      );

    if(box){

      box.style.display =
        Number(r.id) === Number(restaurantId)
          ? "block"
          : "none";

    }

  });


  document.getElementById(
    "search"
  ).value = "";


  updateCart();


  await loadMenu(
    restaurant.id
  );

}


/* =========================================
   LOAD RESTAURANT MENU
========================================= */

async function loadMenu(
  restaurantId
){

  const menuBox =
    document.getElementById(
      "menu-" + restaurantId
    );


  if(!menuBox) return;


  menuBox.innerHTML =
    '<div class="loading">' +
    'Loading menu...' +
    '</div>';


  const { data, error } =
    await supabaseClient

      .from("menu_items")

    .select(
  "id,restaurant_id,name,description,price,image_url,available,created_at,category"
) 
      )

      .eq(
        "restaurant_id",
        restaurantId
      )

      .eq(
        "available",
        true
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Menu loading error:",
      error
    );

    menuBox.innerHTML =
      '<div class="error">' +
      'Unable to load menu.<br><br>' +
      escapeHTML(error.message) +
      '</div>';

    return;
  }


  if(!data || data.length === 0){

    menuBox.innerHTML =
      '<div class="empty">' +
      'No menu items available.' +
      '</div>';

    return;
  }


  menuBox.innerHTML = "";


  data.forEach(function(item){

    const menuItem =
      document.createElement("div");

    menuItem.className =
      "menu-item";


    menuItem.innerHTML = `

      <div>

        <h3>
          ${escapeHTML(
            item.name
          )}
        </h3>

        <p class="description">
          ${escapeHTML(
            item.description || ""
          )}
        </p>

        <span class="price">
          KSh
          ${Number(
            item.price
          ).toLocaleString()}
        </span>

      </div>

      <button>
        Add
      </button>

    `;


    menuItem
      .querySelector("button")
      .addEventListener(
        "click",
        function(){

          addToCart(
            currentRestaurant.id,
            item
          );

        }
      );


    menuBox.appendChild(
      menuItem
    );

  });


  searchFood();

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(
  restaurantId,
  item
){

  if(!carts[restaurantId]){

    carts[restaurantId] = [];

  }


  const cart =
    carts[restaurantId];


  const existing =
    cart.find(
      x =>
        Number(x.menu_item_id) ===
        Number(item.id)
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      menu_item_id:
        item.id,

      name:
        item.name,

      price:
        Number(item.price),

      qty:
        1

    });

  }


  updateCart();

}


/* =========================================
   GET CURRENT CART
========================================= */

function getCart(){

  if(!currentRestaurant){

    return [];

  }


  if(!carts[currentRestaurant.id]){

    carts[currentRestaurant.id] = [];

  }


  return carts[currentRestaurant.id];

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQty(
  index,
  amount
){

  const cart =
    getCart();


  if(!cart[index]) return;


  cart[index].qty += amount;


  if(cart[index].qty <= 0){

    cart.splice(
      index,
      1
    );

  }


  updateCart();

}


/* =========================================
   REMOVE ITEM
========================================= */

function removeFromCart(
  index
){

  const cart =
    getCart();


  if(!cart[index]) return;


  cart.splice(
    index,
    1
  );


  updateCart();

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

  const cart =
    getCart();


  let count = 0;

  let total = 0;


  cart.forEach(function(item){

    count +=
      Number(item.qty);

    total +=
      Number(item.price) *
      Number(item.qty);

  });


  document.getElementById(
    "count"
  ).textContent =
    count;


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "modalTotal"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "cartRestaurant"
  ).textContent =
    currentRestaurant
      ? "🍽️ " +
        currentRestaurant.name
      : "Restaurant";


  document.getElementById(
    "cartBar"
  ).style.display =
    count > 0
      ? "flex"
      : "none";


  renderCart();

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const box =
    document.getElementById(
      "items"
    );


  const cart =
    getCart();


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">' +
      '🛒 Your cart is empty.' +
      '</div>';

    return;

  }


  box.innerHTML = "";


  cart.forEach(
    function(item,index){

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "cart-item";


      row.innerHTML = `

        <div>

          <strong>
            ${escapeHTML(
              item.name
            )}
          </strong>

          <br>

          <small>
            KSh
            ${Number(
              item.price
            ).toLocaleString()}
            each
          </small>

        </div>

        <div class="quantity">

          <button
            onclick="changeQty(
              ${index},
              -1
            )"
          >
            −
          </button>

          <strong>
            ${item.qty}
          </strong>

          <button
            onclick="changeQty(
              ${index},
              1
            )"
          >
            +
          </button>

        </div>

        <div>

          <strong>
            KSh
            ${(
              Number(item.price) *
              Number(item.qty)
            ).toLocaleString()}
          </strong>

          <button
            class="remove"
            onclick="removeFromCart(
              ${index}
            )"
          >
            ×
          </button>

        </div>

      `;


      box.appendChild(
        row
      );

    }
  );

}


/* =========================================
   OPEN CART
========================================= */

function openCart(){

  if(getCart().length === 0){

    alert(
      "Your " +
      currentRestaurant.name +
      " cart is empty. Please add food first."
    );

    return;

  }


  document.getElementById(
    "cartModal"
  ).style.display =
    "block";

}


/* =========================================
   CLOSE CART
========================================= */

function closeCart(){

  document.getElementById(
    "cartModal"
  ).style.display =
    "none";

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  const cart =
    getCart();


  if(cart.length === 0){

    alert(
      "Please add food first."
    );

    return;

  }


  if(!currentRestaurant){

    alert(
      "Please choose a restaurant."
    );

    return;

  }


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const payment =
    document.getElementById(
      "payment"
    ).value;


  const location =
    document.getElementById(
      "location"
    ).value.trim();


  if(!name){

    alert(
      "Please enter your name."
    );

    return;

  }


  if(!phone){

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if(type === "Delivery" && !location){

    alert(
      "Please enter your delivery location."
    );

    return;

  }


  const whatsappNumber =
    String(
      currentRestaurant.whatsapp ||
      ""
    ).replace(
      /[^0-9]/g,
      ""
    );


  if(!whatsappNumber){

    alert(
      "This restaurant does not have a WhatsApp number registered yet."
    );

    return;

  }


  let total = 0;


  cart.forEach(function(item){

    total +=
      Number(item.price) *
      Number(item.qty);

  });


  const checkoutButton =
    document.getElementById(
      "checkoutButton"
    );


  checkoutButton.disabled =
    true;


  checkoutButton.textContent =
    "Saving order...";


  try{


    /* ===============================
       SAVE CUSTOMER
    =============================== */

    const {
      data: customer,
      error: customerError
    } =
      await supabaseClient

        .from("customers")

        .insert({

          full_name:
            name,

          phone:
            phone,

          email:
            null,

          address:
            location ||
            "Pickup"

        })

        .select()

        .single();


    if(customerError){

      throw new Error(
        "Customer error: " +
        customerError.message
      );

    }


    /* ===============================
       SAVE ORDER
    =============================== */

    const {
      data: order,
      error: orderError
    } =
      await supabaseClient

        .from("orders")

        .insert({

          restaurant_id:
            currentRestaurant.id,

          customer_id:
            customer.id,

          customer_name:
            name,

          customer_phone:
            phone,

          delivery_address:
            location ||
            "Pickup",

          order_status:
            "pending",

          total_amount:
            total

        })

        .select()

        .single();


    if(orderError){

      throw new Error(
        "Order error: " +
        orderError.message
      );

    }


    /* ===============================
       SAVE ORDER ITEMS
    =============================== */

    const orderItems =
      cart.map(function(item){

        return {

          order_id:
            order.id,

          menu_item_id:
            item.menu_item_id,

          quantity:
            item.qty,

          price:
            item.price

        };

      });


    const {
      error: itemsError
    } =
      await supabaseClient

        .from("order_items")

        .insert(
          orderItems
        );


    if(itemsError){

      throw new Error(
        "Order items error: " +
        itemsError.message
      );

    }


    /* ===============================
       PAYMENT TEXT
    =============================== */

    let paymentText =
      "Cash on Delivery / Pickup";


    if(
      payment ===
      "till4574509"
    ){

      paymentText =
        "M-Pesa Till: 4574509";

    }


    if(
      payment ===
      "till4578247"
    ){

      paymentText =
        "M-Pesa Till: 4578247";

    }


    /* ===============================
       WHATSAPP MESSAGE
    =============================== */

    let message =
      "🍽️ NEW MloHub ORDER\n\n";


    message +=
      "Order ID: #" +
      order.id +
      "\n";


    message +=
      "Restaurant: " +
      currentRestaurant.name +
      "\n";


    message +=
      "Customer: " +
      name +
      "\n";


    message +=
      "Phone: " +
      phone +
      "\n";


    message +=
      "Order Type: " +
      type +
      "\n";


    if(location){

      message +=
        "Location: " +
        location +
        "\n";

    }


    message +=
      "Payment: " +
      paymentText +
      "\n\n";


    message +=
      "ORDER ITEMS:\n";


    cart.forEach(function(item){

      const itemTotal =
        Number(item.price) *
        Number(item.qty);


      message +=
        item.qty +
        " x " +
        item.name +
        " - KSh " +
        itemTotal.toLocaleString() +
        "\n";

    });


    message +=
      "\nTOTAL: KSh " +
      total.toLocaleString();


    /* ===============================
       WHATSAPP LINK
    =============================== */

    const whatsappLink =
      "https://wa.me/" +
      whatsappNumber +
      "?text=" +
      encodeURIComponent(
        message
      );


    /* ===============================
       CLEAR CART
    =============================== */

    carts[
      currentRestaurant.id
    ] = [];


    updateCart();


    closeCart();


    alert(
      "✅ MloHub Order #" +
      order.id +
      " saved successfully.\n\n" +
      "WhatsApp will now open for " +
      currentRestaurant.name +
      "."
    );


    window.open(
      whatsappLink,
      "_blank"
    );


  }catch(error){

    console.error(
      "PLACE ORDER ERROR:",
      error
    );


    alert(
      "❌ Order could not be completed.\n\n" +
      error.message
    );


  }finally{

    checkoutButton.disabled =
      false;

    checkoutButton.textContent =
      "📲 Place Order on WhatsApp";

  }

}

========================================= */

function searchFood(){

  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();


  if(!currentRestaurant)
    return;


  const activeRestaurant =
    document.getElementById(
      "restaurant-" +
      currentRestaurant.id
    );


  if(!activeRestaurant)
    return;


  activeRestaurant
    .querySelectorAll(
      ".menu-item"
    )
    .forEach(function(item){

      const text =
        item.textContent
          .toLowerCase();


      item.style.display =
        text.includes(search)
          ? "flex"
          : "none";

    });

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
