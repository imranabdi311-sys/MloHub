<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MloHub - Food Delivery</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f7f7f7;
  color:#222;
  padding-bottom:100px;
}

header{
  background:#f59e0b;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  font-size:30px;
}

header p{
  margin-top:6px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h2{
  margin-bottom:15px;
}

.restaurant-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.restaurant-buttons button{
  flex:1;
  min-width:180px;
  font-size:16px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:20px;
  font-size:16px;
  background:white;
}

.restaurant{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.restaurant h2{
  margin-bottom:6px;
}

.location{
  color:#666;
  margin-bottom:15px;
}

.restaurant-note{
  background:#fff7e6;
  border-left:4px solid #f59e0b;
  padding:10px;
  margin-bottom:15px;
  border-radius:5px;
}

.status-open{
  display:inline-block;
  background:#d1e7dd;
  color:#0f5132;
  padding:7px 12px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.status-closed{
  display:inline-block;
  background:#f8d7da;
  color:#842029;
  padding:7px 12px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.category{
  margin-top:25px;
  margin-bottom:5px;
  padding-top:10px;
  border-top:2px solid #f59e0b;
}

.menu-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #eee;
  padding:15px 0;
  gap:15px;
}

.menu-item h3{
  margin-bottom:5px;
}

.description{
  color:#666;
  margin-bottom:8px;
  line-height:1.4;
}

.price{
  font-weight:bold;
  color:#f59e0b;
}

button{
  background:#f59e0b;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.cart-bar{
  position:fixed;
  bottom:15px;
  left:15px;
  right:15px;
  background:#222;
  color:white;
  padding:14px;
  border-radius:12px;
  max-width:900px;
  margin:auto;
  z-index:1000;
  display:none;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.cart-bar button{
  background:#f59e0b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  overflow:auto;
  padding:20px;
}

.modal-box{
  background:white;
  max-width:650px;
  margin:30px auto;
  padding:20px;
  border-radius:15px;
}

.modal-box h2{
  margin-bottom:15px;
}

.cart-restaurant{
  background:#f59e0b;
  color:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.quantity{
  display:flex;
  align-items:center;
  gap:7px;
}

.quantity button{
  padding:5px 9px;
}

.total{
  font-size:20px;
  font-weight:bold;
  text-align:right;
  margin:20px 0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

.checkout{
  width:100%;
  margin-top:15px;
  padding:14px;
  font-size:17px;
}

.close{
  width:100%;
  margin-top:10px;
  background:#555;
}

.empty{
  text-align:center;
  padding:20px;
  color:#666;
}

.remove{
  background:#dc2626;
  padding:6px 9px;
}

.restaurant-card-button{
  width:100%;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .restaurant{
    padding:15px;
  }

  .menu-item{
    align-items:flex-start;
  }

  .menu-item button{
    white-space:nowrap;
    padding:9px 12px;
  }

  .cart-bar{
    left:8px;
    right:8px;
    bottom:8px;
    padding:12px 10px;
    font-size:14px;
  }

  .cart-bar button{
    padding:9px 10px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    margin:10px auto;
    padding:15px;
  }

  .cart-item{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

  <h1>🍽️ MloHub</h1>

  <p>
    Discover food. Order easily. Enjoy.
  </p>

</header>


<div class="container">

  <h2>
    🍽️ Choose a Restaurant
  </h2>


  <!-- AUTOMATIC RESTAURANTS -->

  <div
    class="restaurant-buttons"
    id="restaurantButtons"
  >

    <p>
      Loading restaurants...
    </p>

  </div>


  <!-- SEARCH -->

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search food..."
    oninput="searchFood()"
  >


  <!-- AUTOMATIC RESTAURANT AREA -->

  <div id="restaurantArea">

    <div class="empty">
      Loading restaurants...
    </div>

  </div>

</div>


<!-- CART BAR -->

<div
  class="cart-bar"
  id="cartBar"
>

  <span>
    🛒 Cart:
    <strong id="count">0</strong>
  </span>

  <span>
    KSh
    <strong id="total">0</strong>
  </span>

  <button onclick="openCart()">
    View Cart
  </button>

</div>


<!-- CART MODAL -->

<div
  class="modal"
  id="cartModal"
>

  <div class="modal-box">

    <h2>
      🛒 Your Order
    </h2>


    <div
      class="cart-restaurant"
      id="cartRestaurant"
    >
      Restaurant
    </div>


    <div id="items"></div>


    <div class="total">

      Total:
      KSh
      <span id="modalTotal">
        0
      </span>

    </div>


    <h2>
      Customer Details
    </h2>


    <label>
      Name
    </label>

    <input
      id="name"
      placeholder="Your name"
    >


    <label>
      Phone Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="07XXXXXXXX"
    >


    <label>
      Order Type
    </label>

    <select id="type">

      <option value="Delivery">
        🚚 Delivery
      </option>

      <option value="Pickup">
        🏪 Pickup
      </option>

    </select>


    <label>
      Payment Method
    </label>

    <select id="payment">

      <option value="cash">
        💵 Cash on Delivery / Pickup
      </option>

      <option value="till4574509">
        📱 M-Pesa Till: 4574509
      </option>

      <option value="till4578247">
        📱 M-Pesa Till: 4578247
      </option>

    </select>


    <label>
      Location
    </label>

    <textarea
      id="location"
      placeholder="Enter delivery location"
    ></textarea>


    <button
      class="checkout"
      onclick="placeOrder()"
    >
      📲 Place Order on WhatsApp
    </button>


    <button
      class="close"
      onclick="closeCart()"
    >
      Close
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   CURRENT RESTAURANT
========================================= */

let currentRestaurant = null;

let currentRestaurantId = null;


/* =========================================
   RESTAURANT DATA
========================================= */

let restaurantData = {};


/* =========================================
   CARTS
========================================= */

let carts = {};


/* =========================================
   LOAD RESTAURANTS
========================================= */

async function loadRestaurants(){

  const buttons =
    document.getElementById(
      "restaurantButtons"
    );

  const area =
    document.getElementById(
      "restaurantArea"
    );


  buttons.innerHTML =
    "<p>Loading restaurants...</p>";

  area.innerHTML =
    '<div class="empty">Loading restaurants...</div>';


  const { data, error } =
    await supabaseClient

      .from("restaurants")

      .select(
        "id,name,whatsapp,is_open"
      )

      .order(
        "id",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Restaurant error:",
      error
    );

    buttons.innerHTML =
      "❌ Could not load restaurants.";

    area.innerHTML =
      '<div class="empty">Could not load restaurants.</div>';

    return;

  }


  if(!data || data.length === 0){

    buttons.innerHTML =
      "<p>No restaurants available.</p>";

    area.innerHTML =
      '<div class="empty">No restaurants available.</div>';

    return;

  }


  restaurantData = {};

  carts = {};

  buttons.innerHTML = "";

  area.innerHTML = "";


  data.forEach(restaurant => {

    restaurantData[restaurant.id] =
      restaurant;

    carts[restaurant.id] = [];


    /* =========================
       RESTAURANT BUTTON
    ========================= */

    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      "🍽️ " + restaurant.name;


    button.onclick =
      function(){

        selectRestaurant(
          restaurant.id
        );

      };


    buttons.appendChild(button);


    /* =========================
       RESTAURANT CARD
    ========================= */

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "restaurant";


    card.id =
      "restaurant-" +
      restaurant.id;


    card.style.display =
      "none";


    const statusHTML =
      restaurant.is_open === false

        ? `
          <div class="status-closed">
            🔴 Closed
          </div>
        `

        : `
          <div class="status-open">
            🟢 Open
          </div>
        `;


    card.innerHTML = `

      <h2>
        🍽️
        ${escapeHTML(
          restaurant.name
        )}
      </h2>

      ${statusHTML}

      <div class="restaurant-note">

        📍 Ordering from
        <strong>
          ${escapeHTML(
            restaurant.name
          )}
        </strong>

      </div>

      <div
        id="menu-${restaurant.id}"
      >

        <div class="empty">
          Loading menu...
        </div>

      </div>

    `;


    area.appendChild(card);

  });


  /* =========================
     OPEN FIRST RESTAURANT
  ========================= */

  selectRestaurant(
    data[0].id
  );

}


/* =========================================
   SELECT RESTAURANT
========================================= */

async function selectRestaurant(id){

  const restaurant =
    restaurantData[id];


  if(!restaurant){

    alert(
      "Restaurant information not found."
    );

    return;

  }


  currentRestaurantId =
    restaurant.id;


  currentRestaurant =
    restaurant.name;


  document
    .querySelectorAll(
      ".restaurant"
    )
    .forEach(card => {

      card.style.display =
        "none";

    });


  const selected =
    document.getElementById(
      "restaurant-" +
      restaurant.id
    );


  if(selected){

    selected.style.display =
      "block";

  }


  document.getElementById(
    "search"
  ).value = "";


  updateCart();


  await loadRestaurantMenu(
    restaurant.id
  );


  searchFood();

}


/* =========================================
   LOAD MENU
========================================= */

async function loadRestaurantMenu(
  restaurantId
){

  const menuBox =
    document.getElementById(
      "menu-" +
      restaurantId
    );


  if(!menuBox){

    return;

  }


  menuBox.innerHTML =
    '<div class="empty">Loading menu...</div>';


  const { data, error } =
    await supabaseClient

      .from("menu_items")

      .select(
        "id,name,description,price,available,created_at"
      )

      .eq(
        "restaurant_id",
        restaurantId
      )

      .eq(
        "available",
        true
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Menu error:",
      error
    );

    menuBox.innerHTML =
      `
      <div class="empty">
        ❌ Could not load menu.
      </div>
      `;

    return;

  }


  if(!data || data.length === 0){

    menuBox.innerHTML =
      `
      <div class="empty">
        No food items available yet.
      </div>
      `;

    return;

  }


  menuBox.innerHTML = "";


  data.forEach(item => {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "menu-item";


    row.innerHTML = `

      <div>

        <h3>
          ${escapeHTML(
            item.name
          )}
        </h3>

        <p class="description">
          ${escapeHTML(
            item.description || ""
          )}
        </p>

        <span class="price">
          KSh
          ${Number(
            item.price
          ).toLocaleString()}
        </span>

      </div>

      <button>
        Add
      </button>

    `;


    const addButton =
      row.querySelector(
        "button"
      );


    /* CLOSED RESTAURANT */

    if(
      restaurantData[restaurantId] &&
      restaurantData[restaurantId].is_open === false
    ){

      addButton.disabled =
        true;

      addButton.textContent =
        "Closed";

    }


    addButton.onclick =
      function(){

        addToCart(
          item.name,
          Number(item.price),
          item.id,
          restaurantId
        );

      };


    menuBox.appendChild(row);

  });

}


/* =========================================
   GET CURRENT CART
========================================= */

function getCart(){

  if(
    !currentRestaurantId
  ){

    return [];

  }


  if(
    !carts[currentRestaurantId]
  ){

    carts[currentRestaurantId] =
      [];

  }


  return carts[
    currentRestaurantId
  ];

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(
  name,
  price,
  menuItemId,
  restaurantId
){

  if(
    restaurantId !==
    currentRestaurantId
  ){

    alert(
      "Please select this restaurant first."
    );

    return;

  }


  const restaurant =
    restaurantData[
      restaurantId
    ];


  if(
    restaurant &&
    restaurant.is_open === false
  ){

    alert(
      "This restaurant is currently closed."
    );

    return;

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        item.menu_item_id ===
        menuItemId
    );


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:name,

      price:Number(price),

      qty:1,

      menu_item_id:
        menuItemId,

      restaurant_id:
        restaurantId

    });

  }


  updateCart();

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQty(
  index,
  amount
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart[index].qty +=
    amount;


  if(
    cart[index].qty <= 0
  ){

    cart.splice(
      index,
      1
    );

  }


  updateCart();

}


/* =========================================
   REMOVE ITEM
========================================= */

function removeFromCart(
  index
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart.splice(
    index,
    1
  );


  updateCart();

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

  const cart =
    getCart();


  let count = 0;

  let total = 0;


  cart.forEach(item => {

    count +=
      Number(item.qty);

    total +=
      Number(item.price) *
      Number(item.qty);

  });


  document.getElementById(
    "count"
  ).textContent =
    count;


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "modalTotal"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "cartRestaurant"
  ).textContent =
    "🍽️ " +
    (
      currentRestaurant ||
      "Restaurant"
    );


  document.getElementById(
    "cartBar"
  ).style.display =
    count > 0
      ? "flex"
      : "none";


  renderCart();

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const box =
    document.getElementById(
      "items"
    );


  const cart =
    getCart();


  if(
    cart.length === 0
  ){

    box.innerHTML =
      `
      <div class="empty">
        🛒 Your cart is empty.
      </div>
      `;

    return;

  }


  box.innerHTML = "";


  cart.forEach(
    (item,index) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "cart-item";


      row.innerHTML = `

        <div>

          <strong>
            ${escapeHTML(
              item.name
            )}
          </strong>

          <br>

          <small>
            KSh
            ${Number(
              item.price
            ).toLocaleString()}
            each
          </small>

        </div>


        <div class="quantity">

          <button
            onclick="
              changeQty(
                ${index},
                -1
              )
            "
          >
            −
          </button>

          <strong>
            ${item.qty}
          </strong>

          <button
            onclick="
              changeQty(
                ${index},
                1
              )
            "
          >
            +
          </button>

        </div>


        <div>

          <strong>
            KSh
            ${(
              item.price *
              item.qty
            ).toLocaleString()}
          </strong>

          <button
            class="remove"
            onclick="
              removeFromCart(
                ${index}
              )
            "
          >
            ×
          </button>

        </div>

      `;


      box.appendChild(
        row
      );

    }
  );

}


/* =========================================
   OPEN CART
========================================= */

function openCart(){

  if(
    getCart().length === 0
  ){

    alert(
      "Please add food to your cart first."
    );

    return;

  }


  document.getElementById(
    "cartModal"
  ).style.display =
    "block";

}


/* =========================================
   CLOSE CART
========================================= */

function closeCart(){

  document.getElementById(
    "cartModal"
  ).style.display =
    "none";

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  const cart =
    getCart();


  if(
    cart.length === 0
  ){

    alert(
      "Please add food first."
    );

    return;

  }


  const restaurant =
    restaurantData[
      currentRestaurantId
    ];


  if(!restaurant){

    alert(
      "Restaurant information not found."
    );

    return;

  }


  if(
    restaurant.is_open === false
  ){

    alert(
      "This restaurant is currently closed."
    );

    return;

  }


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const payment =
    document.getElementById(
      "payment"
    ).value;


  const location =
    document.getElementById(
      "location"
    ).value.trim();


  if(!name){

    alert(
      "Please enter your name."
    );

    return;

  }


  if(!phone){

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if(
    type === "Delivery" &&
    !location
  ){

    alert(
      "Please enter your delivery location."
    );

    return;

  }


  if(
    !restaurant.whatsapp
  ){

    alert(
      "This restaurant does not have a WhatsApp number configured yet."
    );

    return;

  }


  /* =====================================
     TOTAL
  ===================================== */

  let total = 0;


  cart.forEach(item => {

    total +=
      Number(item.price) *
      Number(item.qty);

  });


  /* =====================================
     SAVE CUSTOMER
  ===================================== */

  const {
    data:customer,
    error:customerError
  } = await supabaseClient

    .from("customers")

    .insert({

      full_name:name,

      phone:phone,

      email:null,

      address:
        location ||
        "Pickup"

    })

    .select()

    .single();


  if(customerError){

    console.error(
      "Customer error:",
      customerError
    );

    alert(
      "Customer could not be saved.\n\n" +
      customerError.message
    );

    return;

  }


  /* =====================================
     SAVE ORDER
  ===================================== */

  const {
    data:order,
    error:orderError
  } = await supabaseClient

    .from("orders")

    .insert({

      restaurant_id:
        restaurant.id,

      customer_id:
        customer.id,

      customer_name:
        name,

      customer_phone:
        phone,

      delivery_address:
        location ||
        "Pickup",

      order_status:
        "pending",

      total_amount:
        total

    })

    .select()

    .single();


  if(orderError){

    console.error(
      "Order error:",
      orderError
    );

    alert(
      "Order could not be saved.\n\n" +
      orderError.message
    );

    return;

  }


  /* =====================================
     SAVE ORDER ITEMS
  ===================================== */

  const orderItems =
    cart.map(item => ({

      order_id:
        order.id,

      menu_item_id:
        item.menu_item_id,

      quantity:
        item.qty,

      price:
        item.price

    }));


  if(
    orderItems.length > 0
  ){

    const {
      error:itemsError
    } = await supabaseClient

      .from("order_items")

      .insert(
        orderItems
      );


    if(itemsError){

      console.error(
        "Order items error:",
        itemsError
      );


      alert(
        "Order #" +
        order.id +
        " was created, but order items could not be saved.\n\n" +
        itemsError.message
      );

      return;

    }

  }


  /* =====================================
     PAYMENT TEXT
  ===================================== */

  let paymentText =
    "Cash on Delivery / Pickup";


  if(
    payment ===
    "till4574509"
  ){

    paymentText =
      "M-Pesa Till: 4574509";

  }


  if(
    payment ===
    "till4578247"
  ){

    paymentText =
      "M-Pesa Till: 4578247";

  }


  /* =====================================
     WHATSAPP MESSAGE
  ===================================== */

  let message =
    "NEW MloHub ORDER\n\n";


  message +=
    "Order ID: #" +
    order.id +
    "\n";


  message +=
    "Restaurant: " +
    restaurant.name +
    "\n";


  message +=
    "Customer: " +
    name +
    "\n";


  message +=
    "Phone: " +
    phone +
    "\n";


  message +=
    "Order Type: " +
    type +
    "\n";


  if(location){

    message +=
      "Location: " +
      location +
      "\n";

  }


  message +=
    "Payment: " +
    paymentText +
    "\n\n";


  message +=
    "ORDER:\n";


  cart.forEach(item => {

    const itemTotal =
      Number(item.price) *
      Number(item.qty);


    message +=
      item.qty +
      " x " +
      item.name +
      " - KSh " +
      itemTotal.toLocaleString() +
      "\n";

  });


  message +=
    "\nTOTAL: KSh " +
    total.toLocaleString();


  /* =====================================
     WHATSAPP
  ===================================== */

  const whatsappNumber =
    String(
      restaurant.whatsapp
    ).replace(
      /\D/g,
      ""
    );


  const whatsappLink =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      message
    );


  /* =====================================
     CLEAR CART
  ===================================== */

  carts[
    currentRestaurantId
  ] = [];


  updateCart();


  closeCart();


  /* =====================================
     SUCCESS
  ===================================== */

  alert(
    "✅ MloHub Order #" +
    order.id +
    " saved successfully!"
  );


  /* =====================================
     OPEN WHATSAPP DIRECTLY
  ===================================== */

  window.location.href =
    whatsappLink;

}


/* =========================================
   SEARCH FOOD
========================================= */

function searchFood(){

  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();


  if(
    !currentRestaurantId
  ){

    return;

  }


  const activeRestaurant =
    document.getElementById(
      "restaurant-" +
      currentRestaurantId
    );


  if(!activeRestaurant){

    return;

  }


  activeRestaurant
    .querySelectorAll(
      ".menu-item"
    )
    .forEach(item => {

      const text =
        item.textContent
          .toLowerCase();


      item.style.display =
        text.includes(search)
          ? "flex"
          : "none";

    });

}

      );

    ){

    }

);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(
    value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
