<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MloHub - Food Delivery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f7f7f7;
  color:#222;
  padding-bottom:100px;
}

header{
  background:#f59e0b;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  font-size:32px;
}

header p{
  margin-top:7px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

h2{
  margin-bottom:12px;
}

.restaurant-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.restaurant-buttons button{
  min-width:180px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:20px;
  background:white;
}

.restaurant{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:25px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.restaurant-header{
  margin-bottom:15px;
}

.restaurant-header h2{
  margin-bottom:5px;
}

.location{
  color:#666;
}

.restaurant-note{
  background:#fff7e6;
  border-left:4px solid #f59e0b;
  padding:10px;
  border-radius:5px;
  margin-bottom:15px;
}

.category{
  margin-top:20px;
  padding-top:12px;
  border-top:2px solid #f59e0b;
}

.menu-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.menu-info{
  flex:1;
}

.menu-info h3{
  margin-bottom:5px;
}

.description{
  color:#666;
  margin-bottom:7px;
  line-height:1.4;
}

.price{
  color:#f59e0b;
  font-weight:bold;
  font-size:17px;
}

button{
  background:#f59e0b;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cart-bar{
  position:fixed;
  left:15px;
  right:15px;
  bottom:15px;
  max-width:900px;
  margin:auto;
  background:#222;
  color:white;
  padding:14px;
  border-radius:12px;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:1000;
  box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  overflow:auto;
  padding:15px;
}

.modal-box{
  background:white;
  max-width:600px;
  margin:25px auto;
  padding:20px;
  border-radius:15px;
}

.modal-box h2{
  margin-bottom:15px;
}

.cart-restaurant{
  background:#f59e0b;
  color:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:bold;
}

.cart-item{
  border-bottom:1px solid #eee;
  padding:13px 0;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:7px;
}

.quantity button{
  padding:5px 9px;
}

.remove{
  background:#dc2626;
  padding:5px 9px;
}

.total{
  text-align:right;
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:80px;
}

.checkout{
  width:100%;
  margin-top:15px;
  padding:15px;
  font-size:17px;
}

.close{
  width:100%;
  margin-top:10px;
  background:#555;
}

.empty{
  text-align:center;
  padding:25px;
  color:#666;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .restaurant{
    padding:15px;
  }

  .menu-item{
    align-items:flex-start;
  }

  .menu-item button{
    white-space:nowrap;
  }

  .cart-bar{
    left:8px;
    right:8px;
    bottom:8px;
    font-size:14px;
  }

  .modal{
    padding:8px;
  }

  .modal-box{
    margin:10px auto;
    padding:15px;
  }

}
</style>
</head>

<body>

<header>
  <h1>🍽️ MloHub</h1>
  <p>Discover food. Order easily. Enjoy.</p>
</header>

<div class="container">

  <h2>🍽️ Choose a Restaurant</h2>

  <div id="restaurantButtons" class="restaurant-buttons">
    <div class="loading">
      Loading restaurants...
    </div>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Search food..."
    oninput="searchFood()"
  >

  <div id="restaurantsContainer"></div>

</div>


<!-- CART BAR -->

<div class="cart-bar" id="cartBar">

  <span>
    🛒 <strong id="count">0</strong> items
  </span>

  <span>
    KSh <strong id="total">0</strong>
  </span>

  <button onclick="openCart()">
    View Cart
  </button>

</div>


<!-- CART -->

<div class="modal" id="cartModal">

  <div class="modal-box">

    <h2>🛒 Your Order</h2>

    <div
      class="cart-restaurant"
      id="cartRestaurant">
      Restaurant
    </div>

    <div id="items"></div>

    <div class="total">
      Total: KSh
      <span id="modalTotal">0</span>
    </div>

    <h2>Customer Details</h2>

    <label>Customer Name</label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
    >

    <label>Phone Number</label>

    <input
      id="phone"
      type="tel"
      placeholder="07XXXXXXXX"
    >

    <label>Order Type</label>

    <select id="type">

      <option value="Delivery">
        🚚 Delivery
      </option>

      <option value="Pickup">
        🏪 Pickup
      </option>

    </select>

    <label>Payment Method</label>

    <select id="payment">

      <option value="cash">
        💵 Cash on Delivery / Pickup
      </option>

      <option value="till4574509">
        📱 M-Pesa Till: 4574509
      </option>

      <option value="till4578247">
        📱 M-Pesa Till: 4578247
      </option>

    </select>

    <label>Delivery Location</label>

    <textarea
      id="location"
      placeholder="Enter your delivery location"
    ></textarea>

    <button
      id="placeOrderButton"
      class="checkout"
      onclick="placeOrder()">

      📲 Place Order on WhatsApp

    </button>

    <button
      class="close"
      onclick="closeCart()">

      Close

    </button>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://bhvzpycbztngtwuhxxex.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   MLOHUB DATA
========================================= */

let restaurants = [];

let currentRestaurant = null;

let carts = {};


/* =========================================
   ALBAIK BACKUP
   YOUR CURRENT ALBAIK ID = 2
========================================= */

const ALBAIK_ID = 2;

const ALBAIK_WHATSAPP =
"254742333000";


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   FIND RESTAURANT NAME
========================================= */

function getRestaurantName(row){

  return (
    row.name ||
    row.restaurant_name ||
    row.title ||
    row.business_name ||
    "Restaurant #" + row.id
  );

}


/* =========================================
   FIND WHATSAPP NUMBER
========================================= */

function getWhatsApp(row){

  return (
    row.whatsapp ||
    row.whatsapp_number ||
    row.phone ||
    row.phone_number ||
    ""
  );

}


/* =========================================
   LOAD RESTAURANTS
========================================= */

async function loadRestaurants(){

  const buttons =
    document.getElementById(
      "restaurantButtons"
    );

  const container =
    document.getElementById(
      "restaurantsContainer"
    );


  buttons.innerHTML =
    '<div class="loading">Loading restaurants...</div>';

  container.innerHTML = "";


  const {
    data,
    error
  } =
  await supabaseClient

    .from("restaurants")

    .select("*")

    .order("id",{
      ascending:true
    });


  console.log(
    "RESTAURANTS:",
    data
  );


  /*
    If restaurants table is blocked or empty,
    use Albaik ID 2 as a backup.
  */

  if(error){

    console.error(
      "Restaurants error:",
      error
    );

    restaurants = [

      {
        id: ALBAIK_ID,
        name: "Albaik",
        whatsapp: ALBAIK_WHATSAPP
      }

    ];

  }

  else if(!data || data.length === 0){

    restaurants = [

      {
        id: ALBAIK_ID,
        name: "Albaik",
        whatsapp: ALBAIK_WHATSAPP
      }

    ];

  }

  else{

    restaurants = data;

  }


  buttons.innerHTML = "";


  restaurants.forEach(
    function(restaurant){

      const id =
        Number(restaurant.id);

      const name =
        getRestaurantName(
          restaurant
        );


      if(!carts[id]){

        carts[id] = [];

      }


      const button =
        document.createElement("button");


      button.textContent =
        "🍽️ " + name;


      button.onclick =
        function(){

          showRestaurant(id);

        };


      buttons.appendChild(
        button
      );

    }
  );


  /*
    Automatically show first restaurant
  */

  if(restaurants.length > 0){

    showRestaurant(
      Number(restaurants[0].id)
    );

  }

}


/* =========================================
   SHOW RESTAURANT
========================================= */

async function showRestaurant(
  restaurantId
){

  currentRestaurant =
    restaurants.find(
      function(r){

        return Number(r.id) ===
          Number(restaurantId);

      }
    );


  if(!currentRestaurant){

    return;

  }


  const container =
    document.getElementById(
      "restaurantsContainer"
    );


  container.innerHTML = `

    <div
      class="restaurant"
      id="restaurant-${currentRestaurant.id}">

      <div class="restaurant-header">

        <h2>
          🍽️
          ${escapeHTML(
            getRestaurantName(
              currentRestaurant
            )
          )}
        </h2>

        <p class="location">
          ${escapeHTML(
            currentRestaurant.address ||
            currentRestaurant.location ||
            "Nairobi"
          )}
        </p>

      </div>

      <div class="restaurant-note">

        📍 Ordering from
        <strong>
          ${escapeHTML(
            getRestaurantName(
              currentRestaurant
            )
          )}
        </strong>

      </div>

      <div id="menu-${currentRestaurant.id}">

        <div class="loading">
          Loading menu...
        </div>

      </div>

    </div>

  `;


  await loadMenu(
    Number(currentRestaurant.id)
  );


  searchFood();

  updateCart();

}


/* =========================================
   LOAD MENU
========================================= */

async function loadMenu(
  restaurantId
){

  const menuBox =
    document.getElementById(
      "menu-" + restaurantId
    );


  if(!menuBox){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient

    .from("menu_items")

    .select(
      "id,restaurant_id,name,description,price,image_url,available,created_at"
    )

    .eq(
      "restaurant_id",
      restaurantId
    )

    .eq(
      "available",
      true
    )

    .order(
      "created_at",
      {
        ascending:true
      }
    );


  console.log(
    "MENU FOR RESTAURANT:",
    restaurantId,
    data
  );


  if(error){

    console.error(
      "Menu error:",
      error
    );

    menuBox.innerHTML = `

      <div class="empty">

        ❌ Unable to load menu.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

    return;

  }


  if(!data || data.length === 0){

    menuBox.innerHTML = `

      <div class="empty">

        No menu items available.

      </div>

    `;

    return;

  }


  menuBox.innerHTML = "";


  data.forEach(
    function(item){

      const row =
        document.createElement("div");


      row.className =
        "menu-item";


      row.innerHTML = `

        <div class="menu-info">

          <h3>
            ${escapeHTML(item.name)}
          </h3>

          ${
            item.description
            ?
            `
            <p class="description">
              ${escapeHTML(
                item.description
              )}
            </p>
            `
            :
            ""
          }

          <span class="price">

            KSh
            ${Number(
              item.price
            ).toLocaleString()}

          </span>

        </div>

        <button>
          Add
        </button>

      `;


      row
        .querySelector("button")
        .onclick =
        function(){

          addToCart(
            currentRestaurant.id,
            item.name,
            Number(item.price),
            item.id
          );

        };


      menuBox.appendChild(
        row
      );

    }
  );

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(
  restaurantId,
  name,
  price,
  menuItemId
){

  const id =
    Number(restaurantId);


  if(!carts[id]){

    carts[id] = [];

  }


  const cart =
    carts[id];


  const existing =
    cart.find(
      function(item){

        return Number(
          item.menu_item_id
        ) === Number(menuItemId);

      }
    );


  if(existing){

    existing.qty++;

  }

  else{

    cart.push({

      name:name,

      price:Number(price),

      qty:1,

      menu_item_id:
        Number(menuItemId)

    });

  }


  updateCart();


  /*
    Small confirmation
  */

  console.log(
    "Added to cart:",
    name
  );

}


/* =========================================
   CURRENT CART
========================================= */

function getCart(){

  if(!currentRestaurant){

    return [];

  }


  const id =
    Number(
      currentRestaurant.id
    );


  if(!carts[id]){

    carts[id] = [];

  }


  return carts[id];

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart(){

  const cart =
    getCart();


  let count = 0;

  let total = 0;


  cart.forEach(
    function(item){

      count +=
        Number(item.qty);

      total +=
        Number(item.price) *
        Number(item.qty);

    }
  );


  document.getElementById(
    "count"
  ).textContent =
    count;


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "modalTotal"
  ).textContent =
    total.toLocaleString();


  if(currentRestaurant){

    document.getElementById(
      "cartRestaurant"
    ).textContent =
      "🍽️ " +
      getRestaurantName(
        currentRestaurant
      );

  }


  document.getElementById(
    "cartBar"
  ).style.display =
    count > 0
    ? "flex"
    : "none";


  renderCart();

}


/* =========================================
   RENDER CART
========================================= */

function renderCart(){

  const box =
    document.getElementById(
      "items"
    );


  const cart =
    getCart();


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">🛒 Your cart is empty.</div>';

    return;

  }


  box.innerHTML = "";


  cart.forEach(
    function(item,index){

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "cart-item";


      row.innerHTML = `

        <div class="cart-row">

          <div>

            <strong>
              ${escapeHTML(
                item.name
              )}
            </strong>

            <br>

            <small>
              KSh
              ${Number(
                item.price
              ).toLocaleString()}
              each
            </small>

          </div>

          <div class="quantity">

            <button
              onclick="changeQty(${index},-1)">
              −
            </button>

            <strong>
              ${item.qty}
            </strong>

            <button
              onclick="changeQty(${index},1)">
              +
            </button>

          </div>

          <div>

            <strong>
              KSh
              ${(
                item.price *
                item.qty
              ).toLocaleString()}
            </strong>

            <button
              class="remove"
              onclick="removeFromCart(${index})">
              ×
            </button>

          </div>

        </div>

      `;


      box.appendChild(
        row
      );

    }
  );

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQty(
  index,
  amount
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart[index].qty +=
    amount;


  if(cart[index].qty <= 0){

    cart.splice(
      index,
      1
    );

  }


  updateCart();

}


/* =========================================
   REMOVE
========================================= */

function removeFromCart(
  index
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  cart.splice(
    index,
    1
  );


  updateCart();

}


/* =========================================
   OPEN CART
========================================= */

function openCart(){

  if(getCart().length === 0){

    alert(
      "Please add food to your cart first."
    );

    return;

  }


  document.getElementById(
    "cartModal"
  ).style.display =
    "block";

}


/* =========================================
   CLOSE CART
========================================= */

function closeCart(){

  document.getElementById(
    "cartModal"
  ).style.display =
    "none";

}


/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  const cart =
    getCart();


  if(cart.length === 0){

    alert(
      "Your cart is empty."
    );

    return;

  }


  if(!currentRestaurant){

    alert(
      "Please choose a restaurant."
    );

    return;

  }


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const type =
    document.getElementById(
      "type"
    ).value;


  const payment =
    document.getElementById(
      "payment"
    ).value;


  const location =
    document.getElementById(
      "location"
    ).value.trim();


  if(!name){

    alert(
      "Please enter your name."
    );

    return;

  }


  if(!phone){

    alert(
      "Please enter your phone number."
    );

    return;

  }


  if(
    type === "Delivery" &&
    !location
  ){

    alert(
      "Please enter your delivery location."
    );

    return;

  }


  let total = 0;


  cart.forEach(
    function(item){

      total +=
        Number(item.price) *
        Number(item.qty);

    }
  );


  const restaurantId =
    Number(
      currentRestaurant.id
    );


  const restaurantName =
    getRestaurantName(
      currentRestaurant
    );


  /*
    CUSTOMER
  */

  const {
    data:customer,
    error:customerError
  } =
  await supabaseClient

    .from("customers")

    .insert({

      full_name:name,

      phone:phone,

      email:null,

      address:
        location ||
        "Pickup"

    })

    .select()

    .single();


  if(customerError){

    console.error(
      customerError
    );

    alert(
      "Customer could not be saved:\n\n" +
      customerError.message
    );

    return;

  }


  /*
    ORDER
  */

  const {
    data:order,
    error:orderError
  } =
  await supabaseClient

    .from("orders")

    .insert({

      restaurant_id:
        restaurantId,

      customer_id:
        customer.id,

      customer_name:
        name,

      customer_phone:
        phone,

      delivery_address:
        location ||
        "Pickup",

      order_status:
        "pending",

      total_amount:
        total

    })

    .select()

    .single();


  if(orderError){

    console.error(
      orderError
    );

    alert(
      "Order could not be saved:\n\n" +
      orderError.message
    );

    return;

  }


  /*
    ORDER ITEMS

    IMPORTANT:
    Every cart item has menu_item_id
    so the restaurant gets the
    correct food items.
  */

  const orderItems =
    cart.map(
      function(item){

        return {

          order_id:
            order.id,

          menu_item_id:
            Number(
              item.menu_item_id
            ),

          quantity:
            Number(
              item.qty
            ),

          price:
            Number(
              item.price
            )

        };

      }
    );


  const {
    error:itemsError
  } =
  await supabaseClient

    .from("order_items")

    .insert(orderItems);


  if(itemsError){

    console.error(
      itemsError
    );

    alert(
      "Order #" +
      order.id +
      " was created, but order items failed:\n\n" +
      itemsError.message
    );

    return;

  }


  /*
    PAYMENT TEXT
  */

  let paymentText =
    "Cash on Delivery / Pickup";


  if(
    payment ===
    "till4574509"
  ){

    paymentText =
      "M-Pesa Till: 4574509";

  }


  if(
    payment ===
    "till4578247"
  ){

    paymentText =
      "M-Pesa Till: 4578247";

  }


  /*
    WHATSAPP NUMBER
  */

  let whatsappNumber =
    getWhatsApp(
      currentRestaurant
    );


  /*
    ALBAIK FALLBACK
  */

  if(
    restaurantId === ALBAIK_ID &&
    !whatsappNumber
  ){

    whatsappNumber =
      ALBAIK_WHATSAPP;

  }


  if(!whatsappNumber){

    alert(
      "This restaurant does not have a WhatsApp number yet."
    );

    return;

  }


  /*
    REMOVE + FROM PHONE
  */

  whatsappNumber =
    String(
      whatsappNumber
    )
    .replace(
      /[^0-9]/g,
      ""
    );


  /*
    WHATSAPP MESSAGE
  */

  let message =
    "🍽️ *NEW MloHub ORDER*\n\n";


  message +=
    "*Order:* #" +
    order.id +
    "\n";


  message +=
    "*Restaurant:* " +
    restaurantName +
    "\n";


  message +=
    "*Customer:* " +
    name +
    "\n";


  message +=
    "*Phone:* " +
    phone +
    "\n";


  message +=
    "*Order Type:* " +
    type +
    "\n";


  if(location){

    message +=
      "*Location:* " +
      location +
      "\n";

  }


  message +=
    "*Payment:* " +
    paymentText +
    "\n\n";


  message +=
    "*ORDER ITEMS:*\n";


  cart.forEach(
    function(item){

      const itemTotal =
        Number(item.price) *
        Number(item.qty);


      message +=
        "• " +
        item.qty +
        " × " +
        item.name +
        " — KSh " +
        itemTotal.toLocaleString() +
        "\n";

    }
  );


  message +=
    "\n💰 *TOTAL: KSh " +
    total.toLocaleString() +
    "*";


  /*
    WHATSAPP URL
  */

  const whatsappLink =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(
      message
    );


  /*
    CLEAR CART
    AFTER ORDER IS SAVED
  */

  carts[restaurantId] = [];


  updateCart();


  /*
    CLOSE CART
  */

  closeCart();


  /*
    SUCCESS MESSAGE
  */

  alert(
    "✅ MloHub Order #" +
    order.id +
    " saved successfully!\n\n" +
    "WhatsApp will now open for " +
    restaurantName +
    "."
  );


  /*
    OPEN WHATSAPP DIRECTLY
  */

  window.location.href =
    whatsappLink;

}


/* =========================================
   SEARCH
========================================= */

function searchFood(){

  const search =
    document.getElementById(
      "search"
    )
    .value
    .toLowerCase()
    .trim();


  if(!currentRestaurant){

    return;

  }


  const restaurantBox =
    document.getElementById(
      "restaurant-" +
      currentRestaurant.id
    );


  if(!restaurantBox){

    return;

  }


  restaurantBox
    .querySelectorAll(
      ".menu-item"
    )
    .forEach(
      function(item){

        const text =
          item.textContent
            .toLowerCase();


        item.style.display =
          text.includes(search)
          ? "flex"
          : "none";

      }
    );

}

   CLOSE MODAL
========================================= */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "cartModal"
      );


    if(
      event.target === modal
    ){

      closeCart();

    }

  }
);

loadRestaurants();
