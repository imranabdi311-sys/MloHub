<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MloHub | Restaurant Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 15px 50px rgba(0,0,0,.3);
    }

    .logo {
      width: 55px;
      height: 55px;
      background: #f59e0b;
      color: #111;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 17px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f59e0b;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f59e0b;
      color: #111;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">M</div>

  <h1>Restaurant Login</h1>

  <p class="subtitle">
    Sign in to manage your MloHub restaurant.
  </p>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="restaurant@example.com"
      required
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Your password"
      required
    >

    <button id="loginButton" type="submit">
      Login to Dashboard
    </button>

  </form>

  <div class="footer">
    MloHub Restaurant Partner Portal
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://bhvzpycbztngtwuhxxex.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_nt_lF05XbdQtINzqOpdT8g_mJH-8aCq";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // Check whether already logged in
  checkExistingSession();


  async function checkExistingSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {
      return;
    }

    // Make sure this account belongs to a restaurant
    const {
      data,
      error
    } = await supabaseClient
      .from("restaurant_users")
      .select("restaurant_id")
      .eq("user_id", session.user.id)
      .maybeSingle();

    if (!error && data) {
      window.location.href = "dashboard.html";
    }
  }


  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const button =
        document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "Logging in...";

      hideMessage();

      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("Login failed.");
        }

        // Verify restaurant account
        const {
          data: restaurantUser,
          error: restaurantError
        } = await supabaseClient
          .from("restaurant_users")
          .select("restaurant_id")
          .eq("user_id", data.user.id)
          .maybeSingle();

        if (restaurantError) {
          throw restaurantError;
        }

        if (!restaurantUser) {

          await supabaseClient.auth.signOut();

          throw new Error(
            "This account has not been assigned to a restaurant."
          );
        }

        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Invalid email or password.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Login to Dashboard";
      }
    });


  function showMessage(text, type) {

    const message =
      document.getElementById("message");

    message.textContent = text;
    message.className =
      "message " + type;
  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.textContent = "";
    message.className = "message";
  }

</script>

</body>
</html>
