<div class="search-card">

  <h2>
    📦 Track Your Order
  </h2>

  <p>
    Enter your order number and the phone number used when placing the order.
  </p>

  <div class="search-row">

    <input
      id="orderIdInput"
      type="number"
      placeholder="Order number e.g. 35"
    >

    <input
      id="phoneInput"
      type="tel"
      placeholder="Phone e.g. 0712345678"
    >

    <button
      class="track-btn"
      onclick="trackOrder()"
    >
      🔎 Track Order
    </button>

  </div>

</div>
